<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VRHS Chatbot</title>
  <!-- Inline so there is no extra request and no 404 in the console. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e60023'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='15' font-weight='bold' fill='white' text-anchor='middle'%3EVR%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* The app is a fixed frame: only the message list scrolls, never the page
       behind it. Previously the container was 90vh inside a margined body, so
       the whole document scrolled by a few dozen pixels. */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #eef0f2;
      color: #2c2f33;
      -webkit-font-smoothing: antialiased;
    }

    /* One width shared by the composer and the suggestion strip, so they line
       up instead of the suggestions running the full width of the window. */
    :root { --composer-width: 620px; }

    /* Suggestions under the landing composer.
       Only there: once a conversation exists the reader has context and the
       suggestion strip already offers starting points, so a dropdown competing
       with both would be noise. */
    .suggest {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 30;
      background: #fff;
      border: 1px solid #eceef0;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.09);
      overflow: hidden;
    }

    .suggest-item {
      display: block;
      width: 100%;
      padding: 9px 16px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 0.88rem;
      color: #3c4043;
      text-align: left;
      cursor: pointer;
    }

    .suggest-item:hover,
    .suggest-item.active { background: #f5f6f7; }

    .suggest-item mark {
      background: none;
      color: #1f2225;
      font-weight: 600;
    }

    /* ===================================================================
       The ranger.
       ===================================================================
       Ask after the mascot and he walks in along the top of the composer,
       waves, and leaves. One sheet, two rows of eight: row 0 walks, row 1
       waves. steps(8) is what makes it read as pixel art - the frame has to
       snap rather than blend.

       Rebuilt from the original sheet, which had a near-opaque black backdrop
       that would have rendered as a black box. The backdrop is flood-filled
       away from each frame's edge rather than thresholded, so the character's
       own dark outline and boots survive, and every frame is bottom-aligned on
       one baseline so he does not bob while walking. */
    /* The strip he walks along, and the reason he does not appear from
       nothing. It clips at its own edges, so he passes behind them the way a
       figure walks off the side of a stage rather than fading out mid-air.
       Cheaper than an overlay too: an occluding white block would have to
       match whatever is behind it, and here there is a pill, a suggestion
       strip and a page edge behind it depending on the skin. */
    .ranger-stage {
      position: absolute;
      left: 0;
      right: 0;
      /* A hair above the pill, so his boots clear its outline instead of
         being crossed by it. */
      bottom: calc(100% + 3px);
      height: 40px;
      overflow: hidden;
      pointer-events: none;
      z-index: 40;
    }

    .ranger {
      position: absolute;
      bottom: 0;
      /* Half the height he started at. At 54px he was as tall as the headline
         he walks under and read as a character standing in the interface
         rather than a small joke crossing it. */
      width: 19px;
      height: 38px;
      background-image: url("/static/ranger.png");
      background-size: 152px 76px;
      background-repeat: no-repeat;
      /* Smoothing pixel art is the one thing that always looks wrong. */
      image-rendering: pixelated;
      pointer-events: none;
      z-index: 40;
    }

    .ranger.walking { animation: rangerWalk 0.72s steps(8) infinite; }
    .ranger.waving { animation: rangerWave 1.1s steps(8) infinite; }

    /* Mirrored for the walk home; the sheet only faces one way. */
    .ranger.leaving { transform: scaleX(-1); }

    @keyframes rangerWalk {
      from { background-position: 0 0; }
      to { background-position: -152px 0; }
    }

    @keyframes rangerWave {
      from { background-position: 0 -38px; }
      to { background-position: -152px -38px; }
    }

    /* He stands on the composer pill, not on the row that contains it.
       The row is flex:1 on the landing screen - nearly the whole height of
       the window - so "bottom: 100%" of it put him a screenful above the
       top edge, where the container's overflow clipped him out of
       existence. The pill is the same modest height in both states, which
       is what makes it a floor he can stand on. */
    .input-pill { position: relative; }

    /* If the greeting and the standing disclaimer are already on screen when
       the skin is switched, they shrink rather than vanish - removing turns of
       a conversation someone is reading would be worse than making them small.
       A fresh compact session never renders them at all. */
    body.compact .mid-disclaimer { font-size: 0.62rem; line-height: 1.35; }

    /* ===================================================================
       Compact mode, toggled with the 2 key.
       ===================================================================
       A second skin over the same markup, not a second interface. Everything
       below is an override on body.compact, so the two cannot drift apart the
       way a forked template would - a fix to the composer or the feedback row
       lands in both by construction.

       It inverts the ground: the default is a white card floating on grey, and
       this is grey chrome on white, with smaller type throughout.
       ------------------------------------------------------------------- */
    body.compact { background: #ffffff; padding: 0; }

    body.compact .chat-container {
      max-width: 780px;
      height: 100%;
      background: #fff;
      border-radius: 0;
      box-shadow: none;
    }

    /* The bar carried a greeting and a menu. The greeting told you what the
       app is while you were already looking at it, and the menu is two links.
       Dropping the whole strip buys about fifty pixels of conversation, which
       is the scarce thing on this screen. */
    body.compact .chat-header { display: none; }

    /* The message list is cut off flat at both ends - by the top of the frame
       and by the composer below it. A mask fades the last few pixels instead,
       so text passes out of view rather than being sliced. Cheaper and
       steadier than overlaying two gradient elements, which would have to be
       kept in front of the content and behind the scrollbar. */
    body.compact .chat-messages {
      padding: 18px 18px 14px 18px;
      -webkit-mask-image: linear-gradient(to bottom,
                          transparent 0, #000 20px,
                          #000 calc(100% - 26px), transparent 100%);
      mask-image: linear-gradient(to bottom,
                  transparent 0, #000 20px,
                  #000 calc(100% - 26px), transparent 100%);
    }
    body.compact .chat-bubble { font-size: 0.86rem; padding: 10px 13px; }
    body.compact .source-pill,
    body.compact .fb-reason,
    body.compact .fb-input { font-size: 0.68rem; padding: 2px 8px; }
    body.compact .fb-hint { font-size: 0.66rem; }
    body.compact .source-lead { font-size: 0.66rem; }
    body.compact .pill-tip { font-size: 0.68rem; max-width: 240px; }

    /* The caution was sized for a page where it was the only thing under an
       answer. Here it competes with the conversation for a smaller screen, and
       it is a footnote rather than an announcement. */
    /* The elbow connector hangs 9px above the card and 1px from its left
       edge, so the card needs headroom above it and clearance to its left or
       the bracket is clipped by the message column. The default sizing gave it
       both; the compact override took them away. */
    body.compact .verify-card {
      margin: 2px 0 8px 10px;
      padding: 0 0 0 22px;
      font-size: 0.7rem;
      line-height: 1.4;
    }
    body.compact .verify-card::before {
      top: -6px;
      width: 12px;
      height: 19px;
    }
    body.compact .verify-card .verify-title { font-size: 0.7rem; }
    body.compact .fb-btn { width: 24px; height: 24px; }
    body.compact .fb-btn svg { width: 14px; height: 14px; }
    body.compact .chat-input {
      padding: 2px 16px 8px 16px;
    }
    body.compact .chat-input input { font-size: 0.82rem; padding: 7px 11px; }
    body.compact .input-pill { padding: 3px 3px 3px 7px; }
    body.compact .chat-input button { width: 30px; height: 30px; }
    body.compact .quick-prompts {
      padding: 3px 0 2px 0;
      gap: 6px;
    }
    body.compact .quick-prompts button {
      font-size: 0.68rem;
      padding: 3px 9px;
    }

    /* --- the landing state ---------------------------------------------
       Before the first question there is no conversation to show, so the
       composer is the whole interface: one wide box in the middle of an empty
       page. Sending the first question is what turns it into a chat window. */
    body.compact.awaiting .chat-messages,
    body.compact.awaiting .quick-prompts { display: none; }

    /* The line above the box on the landing screen. It is the only thing
       telling a first-time reader what this is for, and it goes the moment
       there is a conversation to read instead. */
    .landing-title { display: none; }

    body.compact.awaiting .landing-title {
      display: block;
      width: 100%;
      max-width: 760px;
      margin: 0 auto 44px auto;
      padding: 0 8px;
      /* A display face, not the interface font. This is the one piece of
         type on the screen that is meant to be looked at rather than read
         through, and Public Sans at 40px is just a big version of the
         placeholder underneath it. */
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 5.2vw, 3.1rem);
      line-height: 1.15;
      font-weight: 400;
      letter-spacing: -0.015em;
      color: #1f2225;
      text-align: center;
      animation: settleIn 0.45s ease both;
    }

    /* The second line explained what the box below it already says. */
    body.compact.awaiting .landing-title span { display: none; }

    body.compact.awaiting .chat-input {
      flex-direction: column;
    }

    body.compact.awaiting .chat-input {
      flex: 1;
      align-items: center;
      padding: 0 24px;
    }

    body.compact.awaiting .input-pill {
      max-width: 560px;
      padding: 10px 10px 10px 18px;
    }

    /* The default composer grows when it takes focus and the landing one did
       not, which made the big version feel like a picture of an input rather
       than an input. */
    body.compact.awaiting .input-pill:focus-within {
      max-width: 720px;
      padding: 13px 13px 13px 22px;
    }

    body.compact.awaiting .chat-input input { font-size: 1.05rem; }

    /* Everything that was hidden slides in once the first answer is on its
       way, rather than appearing fully formed. */
    body.compact .chat-messages,
    body.compact .quick-prompts,
    body.compact .chat-header { animation: settleIn 0.34s ease both; }

    @keyframes settleIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* The composer travels from the middle of the page to the bottom. */
    /* Layout is not animated between the two states, only appearance.
       Transitioning flex and max-width meant the composer was re-laid out on
       every frame, and a 999px radius on a box whose width is mid-flight
       renders as an ellipse - which is what "pills morphing into ovals" was.
       The layout now switches in one frame and the composer slides the short
       distance into place, which reads as the same movement and cannot
       distort anything.

       Focus growth keeps its transition: that one is a genuine width change
       the reader caused, and it is not competing with a reflow. */
    body.compact .input-pill { transition: max-width 0.3s ease,
                                           padding 0.3s ease; }

    body.compact:not(.awaiting) .chat-input {
      animation: composerSettle 0.34s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes composerSettle {
      from { transform: translateY(-14px); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }

    body.compact .chat-messages,
    body.compact .quick-prompts { animation-duration: 0.3s; }

    /* --- the snake -------------------------------------------------------
       A red segment that runs the perimeter on hover. Drawn as an SVG rect
       rather than an animated border because a border cannot be dashed round
       a radius, and pathLength="100" normalises the dash to the shape, so one
       set of numbers works at every width the box takes. */
    .pill-snake {
      position: absolute;
      /* Outside the pill's own edge rather than on it. Sharing the line made
         it look like the border had simply changed colour; a couple of pixels
         out reads as something drawn around the box. */
      inset: -3px;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    body.compact .input-pill { position: relative; }
    body.compact .input-pill:hover .pill-snake { opacity: 1; }
    body.compact .input-pill:focus-within .pill-snake { opacity: 0; }

    .pill-snake rect {
      /* Sized here, not on the element. The rect must sit a pixel inside the
         box so the stroke is not clipped, and that is calc() - which an SVG
         presentation attribute cannot express but a CSS geometry property
         can. */
      width: calc(100% - 2px);
      height: calc(100% - 2px);
      fill: none;
      stroke: #e60023;
      stroke-width: 1.1;
      stroke-linecap: round;
      /* The outline draws itself on, once, and stays.
         pathLength="100" makes the dash a percentage of the perimeter, so one
         full-length dash pushed fully out of view is an undrawn border, and
         easing the offset back to zero draws it from a point round to itself.
         The previous version was a short dash looping forever, which is a
         different thing entirely - a bead orbiting the box rather than the
         box's own edge arriving. */
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      transition: stroke-dashoffset 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* rx and ry are set from script, not here, and the reason is worth
       recording. rx="999" on a rect does not mean "as round as possible": rx
       and ry are clamped independently, rx to half the width and ry to half
       the height. On a composer 500px wide and 40px tall that gives corners
       500 wide and 40 tall - four quarter-ellipses that meet in the middle,
       which is an oval, not a pill. A pill needs rx == ry == half the height,
       and the height changes between the two skins and again on focus, so the
       only correct value is one measured at the time. */

    body.compact .input-pill:hover .pill-snake rect { stroke-dashoffset: 0; }

    /* Red caret, so the one part of the page you are acting on is the one
       part that is not grey. */
    body.compact .chat-input input { caret-color: #e60023; }

    /* --- the disclaimer -------------------------------------------------- */
    /* No dimming sheet over the page. A full-bleed scrim darkens the whole
       window to draw attention to one small card, which is a heavier gesture
       than a first-use notice deserves and washes out the interface behind it.
       The card carries its own weight with a shadow; the layer around it only
       exists to catch clicks and is invisible. */
    .disclaimer {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* Barely tinted, and blurred. A blur says "this is in front" without
         darkening the page to make the point, which is what the scrim did. */
      background: rgba(255, 255, 255, 0.35);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
    }

    .disclaimer-card {
      max-width: 400px;
      padding: 20px 22px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #eceef0;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.20),
                  0 2px 8px rgba(0, 0, 0, 0.08);
      animation: settleIn 0.22s ease both;
    }

    .disclaimer-card h3 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      color: #2c2f33;
    }

    .disclaimer-card p {
      margin: 0 0 16px 0;
      font-size: 0.85rem;
      line-height: 1.55;
      color: #5f6368;
    }

    .disclaimer-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .disclaimer-actions button {
      font-family: inherit;
      font-size: 0.82rem;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #e0e3e6;
      background: #fff;
      color: #5f6368;
      cursor: pointer;
    }

    .disclaimer-actions .accept {
      border-color: #e60023;
      background: #e60023;
      color: #fff;
      /* Room for the arrow to move into, reserved now so the button does not
         resize under the cursor. */
      padding-right: 16px;
      transition: padding-right 0.18s ease, background-color 0.15s ease;
    }

    .disclaimer-actions .accept .arrow {
      display: inline-block;
      width: 0;
      margin-left: 0;
      opacity: 0;
      overflow: hidden;
      transition: width 0.18s ease, margin-left 0.18s ease,
                  opacity 0.18s ease;
    }

    .disclaimer-actions .accept:hover {
      background: #c40020;
      padding-right: 13px;
    }

    .disclaimer-actions .accept:hover .arrow {
      width: 12px;
      margin-left: 6px;
      opacity: 1;
    }

    /* Keyboard users get a visible target; mouse users do not see a ring.
       The feedback controls are real <button> elements, so they are already
       covered here and need no selector of their own. */
    button:focus-visible,
    a:focus-visible,
    .fb-input:focus-visible {
      outline: 2px solid #e60023;
      outline-offset: 2px;
    }

    .chat-container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05),
                  0 8px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    .chat-header {
      padding: 18px 24px;
      background: linear-gradient(to bottom, #2f3237, #17191c);
      color: white;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }
    .options-button {
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      user-select: none;
      opacity: 0.7;
      padding: 2px 6px;
      border-radius: 6px;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }
    .options-button:hover {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.1);
    }
    .chat-messages {
      flex: 1;
      padding: 24px 26px 18px 26px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    /* Keep the scrollbar from competing with the conversation. */
    .chat-messages::-webkit-scrollbar { width: 0; height: 0; }
    .chat-messages { scrollbar-width: none; -ms-overflow-style: none; }

    .chat-bubble {
      padding: 13px 17px;
      margin: 10px 0;
      width: max-content;
      max-width: 75%;
      line-height: 1.58;
      word-wrap: break-word;
      white-space: pre-line;
      animation: fadeUp 0.24s ease both;
    }
    .chat-bubble strong {
      font-weight: bold;
    }
    .chat-bubble p {
      margin: 0;
    }
    .bot {
      background-color: #f4f5f6;
      color: #2c2f33;
      align-self: flex-start;
      /* a small corner radius rather than a hard point reads less dated */
      border-radius: 18px 18px 18px 4px;
      text-align: left;
    }

    .bot a {
      color: #c40020;
      text-decoration: none;
      border-bottom: 1px solid rgba(196, 0, 32, 0.3);
      transition: border-color 0.15s ease;
    }

    .bot a:hover { border-bottom-color: #c40020; }

    .user {
      background-color: #e60023;
      color: white;
      align-self: flex-end;
      text-align: left;
      margin-left: auto;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 1px 2px rgba(230, 0, 35, 0.22);
    }

    
    .chat-input {
      display: flex;
      justify-content: center;
      padding: 4px 16px 12px 16px;
      background-color: white;
    }

    /* One centred pill rather than a full-width bar: the composer reads as a
       single control, and on a 1000px container an edge-to-edge input is a lot
       of empty space to type one line into. It grows on focus, because that is
       when the extra room is actually useful. */
    .input-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      max-width: var(--composer-width);
      padding: 5px 5px 5px 8px;
      border: 1.5px solid #e0e3e6;
      border-radius: 999px;
      background-color: #fafbfc;
      transition: max-width 0.42s cubic-bezier(0.33, 0.9, 0.35, 1),
                  padding 0.42s ease,
                  border-color 0.2s ease,
                  background-color 0.2s ease;
    }

    .input-pill:focus-within {
      max-width: 730px;
      padding: 7px 7px 7px 12px;
      background-color: #fff;
      /* an outline, not a glow */
      border-color: #e60023;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border: none;
      border-radius: 999px;
      outline: none;
      font-family: 'Public Sans', sans-serif;
      font-size: 0.95rem;
      color: #2c2f33;
      background-color: transparent;
      transition: font-size 0.26s ease;
    }

    .input-pill:focus-within input { font-size: 0.98rem; }
    .chat-input input::placeholder { color: #a8adb3; }

    .chat-input button {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      background-color: #c9cdd2;
      color: white;
      border: none;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.12s ease;
    }
    .chat-input button:active {
      transform: scale(0.92);
    }


    .chat-input input:not(:placeholder-shown) + button {
      background-color: #e60023;
      transition: background-color 0.4s ease-out;
    }
    .quick-prompts {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: var(--composer-width);
      margin: 0 auto;
      padding: 6px 0 4px 0;
      overflow-x: auto;
      background-color: #fff;
      cursor: grab;
      /* Whichever end has more behind it fades. A static fade would blur the
         first pill even at rest, and a hard edge on the left read as a cut. */
      --fade-left: transparent 0, #000 0;
      --fade-right: #000 100%, transparent 100%;
      -webkit-mask-image: linear-gradient(to right, var(--fade-left),
                                          var(--fade-right));
      mask-image: linear-gradient(to right, var(--fade-left),
                                  var(--fade-right));
      transition: none;
    }

    .quick-prompts.fade-start { --fade-left: transparent 0, #000 34px; }
    .quick-prompts.fade-end { --fade-right: #000 calc(100% - 34px), transparent 100%; }

    .quick-prompts.dragging {
      cursor: grabbing;
      scroll-behavior: auto;
    }
    .quick-prompts button {
      font-family: 'Public Sans', sans-serif;
      border: 1px solid #f0c3cb;
      color: #d1001f;
      background: #fff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.86rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.18s ease, color 0.18s ease,
                  border-color 0.18s ease;
    }

    .quick-prompts button:hover {
      background-color: #e60023;
      border-color: #e60023;
      color: white;
    }

    /* the strip still scrolls; the faded right edge is the affordance */
    .quick-prompts::-webkit-scrollbar { height: 0; }

    /* One line under an answer: sources on the left, rating on the right. */

    .fb-btn {

      padding: 0;

    .fb-btn.active { color: #5f6368; }

    .fb-comment {

    .fb-hint {

    .fb-input {
      font-family: inherit;
      font-size: 0.78rem;
      padding: 5px 11px;
      width: calc(7ch + 26px);
      max-width: 260px;
      min-height: 27px;
      max-height: 88px;

      border: 1px solid #e0e3e6;
      border-radius: 14px;
      outline: none;
      background: #fff;
      color: #2c2f33;
      resize: none;
      overflow-y: auto;

    .fb-input:focus { border-color: #c40020; }

    /* The pill previews what it is citing. A pill names a page and gives no
       way to judge it without leaving the conversation; one line of the text
       the answer actually leaned on is usually enough to tell whether it is

    /* A panel that follows the cursor, not a speech bubble anchored to the

    .pill-tip {

    .source-pills {

    /* Verification notice. Deliberately quiet: it is a caution about an answer

    /* An elbow, not a rule: the line drops from the answer above and turns in

    .verify-card {

<body>
  <div class="chat-container">

    <script>
      // helper from before
      function splitTokens(text) {
        const tokens = [];
        let cur = "", inLink = false;
        for (let ch of text) {
          if (ch === '[')        { inLink = true;  cur += ch; }
          else if (ch === ')' && inLink) { cur += ch; inLink = false; }
          else if (/\s/.test(ch) && !inLink) {
            if (cur) { tokens.push(cur); cur = ""; }
            tokens.push(ch);
          } else cur += ch;
        }
        if (cur) tokens.push(cur);
        return tokens;
      }

      // A cursor-following panel, shared by source pills and by the links
      // inside an answer. Appended to the body rather than to the element it
      // describes: as a child it inherits the message list's clipping, and
      // fixed positioning only escapes that from the top of the document.
      function attachTip(el, text) {
        const tip = document.createElement("span");
        tip.className = "pill-tip";
        // textContent, not innerHTML. This is text scraped off the web and
        // must never be parsed as markup.
        tip.textContent = text;
        document.body.appendChild(tip);

        const place = (e) => {
          const pad = 14;
          let x = e.clientX + pad;
          let y = e.clientY + pad;
          const box = tip.getBoundingClientRect();
          if (x + box.width > window.innerWidth - 8) {
            x = e.clientX - box.width - pad;
          }
          if (y + box.height > window.innerHeight - 8) {
            y = e.clientY - box.height - pad;
          }
          tip.style.left = Math.max(8, x) + "px";
          tip.style.top = Math.max(8, y) + "px";
        };

        el.addEventListener("mouseenter", (e) => {
          place(e);
          tip.classList.add("show");
        });
        el.addEventListener("mousemove", place);
        el.addEventListener("mouseleave", () => tip.classList.remove("show"));
      }

      // Where a link in an answer goes, in the same words the source pills
      // use. A reader deciding whether to click deserves to know it is about
      // to open a Google Doc without having to read the URL.
      function describeLink(href) {
        let host;
        try {
          host = new URL(href, window.location.href).hostname;
        } catch (err) {
          return null;
        }
        const friendly = {
          "docs.google.com": "Opens Google Doc",
          "drive.google.com": "Opens Google Drive file",
          "sites.google.com": "Opens Google Site",
          "calendar.google.com": "Opens Google Calendar",
          "forms.gle": "Opens Google Form",
          "www.leanderisd.org": "Opens the district site",
          "leanderisd.org": "Opens the district site",
          "news.leanderisd.org": "Opens district news",
          "vrhs.leanderisd.org": "Opens the school site"
        };
        return friendly[host] || ("Opens " + host);
      }

      function createFeedbackElement() {
        // Rewritten from a full-width block that announced itself with "Was
        // this helpful?" and sat on its own line under every answer. Three
        // things were wrong with it: the question is cognitive load on someone
        // who came here to read an answer, the controls were larger than the
        // source pills they sat under, and a rating could not be changed once
        // given - a misclick was permanent.
        //
        // Now it is two small icons that live on the same line as the sources,
        // stay invisible until the answer is hovered, and can be changed as
        // often as the reader likes.
        const fb = document.createElement("div");
        fb.className = "feedback-inline";

        fb.innerHTML = `
          <button class="fb-btn" data-type="up" title="Helpful" aria-label="Helpful">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 10C3 9.44772 3.44772 9 4 9H7V21H4C3.44772 21 3 20.5523 3 20V10Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V19L8.9923 20.3282C9.64937 20.7662 10.4214 21 11.2111 21H16.4586C17.9251 21 19.1767 19.9398 19.4178 18.4932L20.6119 11.3288C20.815 10.1097 19.875 9 18.6391 9H14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 9L14.6872 5.56415C14.8659 4.67057 14.3512 3.78375 13.4867 3.49558C12.6336 3.21122 11.7013 3.59741 11.2992 4.4017L8 11H7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="fb-btn" data-type="down" title="Not helpful" aria-label="Not helpful">
            <svg viewBox="0 0 24 24" fill="none" style="transform: rotate(180deg);" aria-hidden="true">

        const META_SENTINEL = ":::meta";

            continue;
          }

          buffer += incoming;
          const sentinelAt = buffer.indexOf(META_SENTINEL);
          if (sentinelAt !== -1) {
            metaBuffer = buffer.slice(sentinelAt + META_SENTINEL.length);
            buffer = buffer.slice(0, sentinelAt);
          }

          let match;

          while ((match = linkRe.exec(buffer)) !== null) {
            const [fullMatch, label, url] = match;
            const idx = match.index;

            // a) flush text before link (with inline markdown)
            if (idx > 0) {
              const chunk = buffer.slice(0, idx);
              const html  = marked.parseInline(chunk);
              const tmp   = document.createElement("span");
              tmp.innerHTML = html;
              bubble.appendChild(tmp);

            a.target    = "_blank";
            a.innerText = label;

            buffer = buffer.slice(idx + fullMatch.length);

          //    - no pending “[” for a link

          const boldMarkers = buffer.match(boldMarkerRe) || [];

            const tmp  = document.createElement("span");
            tmp.innerHTML = html;
            bubble.appendChild(tmp);
            buffer = "";

        const footer = document.createElement("div");
        footer.className = "answer-footer";

        if (Array.isArray(meta.sources) && meta.sources.length) {
          const row = document.createElement("div");
          row.className = "source-pills";

          const lead = document.createElement("span");
          lead.className = "source-lead";
          lead.innerText = "Sources";
          row.appendChild(lead);

          meta.sources.forEach(src => {
            const pill = document.createElement("a");
            pill.className = "source-pill";
            pill.href = src.url;
            pill.target = "_blank";
            pill.rel = "noopener";
            pill.innerText = src.label;

          });
          footer.appendChild(row);
        }

          const card = document.createElement("div");
          card.className = "verify-card";

          const title = document.createElement("div");
          title.className = "verify-title";
          title.innerText = "Worth a second look";
          card.appendChild(title);

          meta.notice.forEach(point => {
            const line = document.createElement("div");

            line.innerText = point;

          });

          // invisible, and nobody hunts for a control they cannot see. Kept
          // visible while a rating is set or the comment box is open, so it
          // does not vanish mid-sentence.

          [bubble, footer, fb.panel].forEach(el => {
            el.addEventListener("mouseenter", () => reveal(true));
            el.addEventListener("mouseleave", () => reveal(false));
            el.addEventListener("focusin", () => reveal(true));
          });

      }

<script>
  // ===================================================================
  // Landing suggestions.
  // ===================================================================
  // A short list of things this corpus can actually answer, matched as you
  // type. Written against what ingest found rather than invented: every one of
  // these has a page, a linked document or a spreadsheet row behind it, so a
  // suggestion is a promise the bot can keep. Offering "when is prom" would be
  // worse than offering nothing.
  //
  // Landing screen only. Once a conversation exists the reader has context,
  // and the suggestion strip already offers openings.
  (function () {
    const QUESTIONS = [
      "What time does school start?",
      "What are the bell schedules for this year?",
      "Is tomorrow an A day or B day?",
      "Where do I find the school calendar?",
      "How many hours do I owe and where do I check?",
      "How do I make up attendance hours?",
      "Where do I report an absence?",
      "What is the student check-out policy?",
      "How do I appeal an attendance decision?",
      "What clubs and organizations are offered?",
      "How do I start a new club?",
      "Who sponsors the Aerospace Club?",
      "When does the AI Club meet?",
      "How do I sign up to volunteer?",
      "How do I get a parking permit?",
      "Where can I find bus information?",
      "How do I find a teacher's email?",
      "Who is the principal?",
      "Where is the staff directory?",
      "Where is the library website?",
      "How do I log into Ranger Time?",
      "How do I request a transcript?",
      "When are the STAAR testing dates?",
      "How do I register for AP tests?",
      "When is the Saturday SAT test?",
      "What resources are there for parents?",
      "Where are the daily announcements?",
      "What do seniors need to do before graduation?",
      "How do I sign up for ACC classes?",
      "Where is the attendance website?",
      "What athletics does the school offer?",
      "Where do I find athletic physical forms?",
      "How do I contact the counseling office?",
      "What is Ranger Camp?",
      "Where do I drop off my student in the morning?",
      "How do I report bullying?",
      "What is on the school calendar this month?",
      "Who do I contact about my schedule?",
      "Where can I find the campus profile?",
      "How do I access my STAAR scores?"
    ];
    const MAX = 3;

    const pill = document.querySelector(".input-pill");
    const box = document.getElementById("query");
    if (!pill || !box) return;

    let panel = null;
    let items = [];
    let cursor = -1;

    const close = function () {
      if (panel) { panel.remove(); panel = null; }
      items = [];
      cursor = -1;
    };

    const escapeHtml = function (t) {
      return t.replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;",
                 '"': "&quot;", "'": "&#39;" }[ch];
      });
    };

    const render = function (matches, typed) {
      close();
      if (!matches.length) return;

      panel = document.createElement("div");
      panel.className = "suggest";

      matches.forEach(function (q) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "suggest-item";

        // The typed run is marked rather than the whole line bolded, so it is
        // obvious which part of the suggestion the reader supplied.
        const at = q.toLowerCase().indexOf(typed);
        b.innerHTML = at < 0
          ? escapeHtml(q)
          : escapeHtml(q.slice(0, at)) + "<mark>"
            + escapeHtml(q.slice(at, at + typed.length)) + "</mark>"
            + escapeHtml(q.slice(at + typed.length));

        // mousedown, not click. The box blurs first on a click, and the panel
        // is already gone by the time a click handler would run.
        b.addEventListener("mousedown", function (e) {
          e.preventDefault();
          box.value = q;
          close();
          if (window.sendMessage) window.sendMessage();
        });

        panel.appendChild(b);
        items.push(b);
      });

      pill.appendChild(panel);
    };

    const update = function () {
      const typed = box.value.trim().toLowerCase();
      const body = document.body;
      if (!body.classList.contains("compact")
          || !body.classList.contains("awaiting")
          || typed.length < 2) {
        close();
        return;
      }
      // Substring anywhere, so "club" finds "How do I start a new club?" and
      // not only the questions that happen to open with it.
      const hits = QUESTIONS.filter(function (q) {
        return q.toLowerCase().indexOf(typed) !== -1;
      }).slice(0, MAX);
      render(hits, typed);
    };

    const move = function (step) {
      if (!items.length) return;
      cursor = (cursor + step + items.length) % items.length;
      items.forEach(function (b, i) {
        b.classList.toggle("active", i === cursor);
      });
    };

    box.addEventListener("input", update);
    box.addEventListener("focus", update);
    box.addEventListener("blur", function () { setTimeout(close, 120); });

    box.addEventListener("keydown", function (e) {
      if (!items.length) return;
      if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
      else if (e.key === "Escape") { close(); }
      else if (e.key === "Enter" && cursor >= 0) {
        e.preventDefault();
        items[cursor].dispatchEvent(new MouseEvent("mousedown"));
      }
    });
  })();

<script>
  // ===================================================================
  // Keep the outline a pill.
  // ===================================================================
  // rx and ry on a <rect> are clamped independently - rx to half the width,
  // ry to half the height - so a large value does not mean "fully rounded",
  // it means an ellipse as wide as the box and as tall as the box. The only
  // value that draws a pill is half the height, and the height changes
  // between skins, on focus, and when the landing screen collapses. So it is
  // measured rather than guessed, and re-measured whenever the box resizes.
  (function () {
    const pill = document.querySelector(".input-pill");
    const rect = document.querySelector(".pill-snake rect");
    if (!pill || !rect) return;

    const fit = () => {
      const r = Math.max(0, (pill.offsetHeight - 2) / 2);
      rect.setAttribute("rx", r);
      rect.setAttribute("ry", r);
    };

    fit();
    if (window.ResizeObserver) {
      new ResizeObserver(fit).observe(pill);
    } else {
      window.addEventListener("resize", fit);
      pill.addEventListener("focusin", fit);
      pill.addEventListener("focusout", fit);
    }
  })();
  </script>

<script>
  // ===================================================================
  // The ranger.
  // ===================================================================
  (function () {
    let busy = false;

    window.summonRanger = function () {
      // One at a time. Asking twice while he is still on screen should not
      // produce two of him walking through each other.
      if (busy) return;
      const rail = document.querySelector(".input-pill");
      if (!rail) return;
      busy = true;

      const stage = document.createElement("div");
      stage.className = "ranger-stage";
      stage.setAttribute("aria-hidden", "true");

      const el = document.createElement("div");
      el.className = "ranger walking";
      el.style.left = "-24px";
      stage.appendChild(el);
      rail.appendChild(stage);

      // How far he walks is a share of the rail rather than a pixel count, so
      // the trip makes sense on a phone and on a wide window. The duration is
      // derived from the distance to hold his speed constant - a fixed
      // duration would have him sprinting across a large screen.
      const stop = Math.max(38, Math.round(rail.clientWidth * 0.16));
      const speed = 76; // px per second, matched to the stride at 0.72s a loop
      const walkMs = Math.round((stop + 24) / speed * 1000);

      requestAnimationFrame(() => {
        el.style.transition = "left " + walkMs + "ms linear";
        el.style.left = stop + "px";
      });

      const leave = () => {
        el.classList.remove("waving");
        el.classList.add("walking", "leaving");
        el.style.transition = "left " + walkMs + "ms linear";
        el.style.left = "-24px";
        setTimeout(() => { stage.remove(); busy = false; }, walkMs + 150);
      };

      const wave = () => {
        el.classList.remove("walking");
        el.classList.add("waving");
        setTimeout(leave, 1500);
      };

      setTimeout(wave, walkMs + 80);
    };
  })();
  </script>

  (function () {

    // The 2 key switches skins, and has to be caught before the type-anywhere

    // this one wants the key, and it would otherwise put a "2" in the
    // composer. Once the composer has focus, 2 is a character again, so a
    // question containing a number types normally.

      if (e.key !== "2" || e.ctrlKey || e.metaKey || e.altKey) return;

      // Leaving never does, because a conversation is already on screen.

        '</div>'
      ].join("");
      document.body.appendChild(wrap);

      const close = () => wrap.remove();
      wrap.querySelector(".cancel").addEventListener("click", close);
      wrap.querySelector(".accept").addEventListener("click", () => {
        accepted = true;
        close();
        proceed();
      });
      wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
      wrap.querySelector(".accept").focus();

      return false;
    };
  })();
  </script>

<script>
  // Enter sends. The composer is a single-line input, so there is no newline
  // to preserve, and reaching for the mouse to send every message was the
  // largest friction in the interface.
  document.addEventListener("DOMContentLoaded", () => {
    const box = document.getElementById("query");

    // Start typing anywhere and the composer takes it.
    //
    // The composer is the only thing anyone types into, so requiring a click
    // first is a step that exists for no reason - and it is easy to lose:
    // clicking a source pill or a thumb moves focus away, and the next
    // keystroke went nowhere.
    //
    // The event is not cancelled, so the character that triggered this lands
    // in the box on its own. Modifier combinations are left alone, or this
    // would swallow copy, paste, find and reload.
    document.addEventListener("keydown", (e) => {
      if (!box || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length !== 1) return;

      const active = document.activeElement;
      const tag = active && active.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (active && active.isContentEditable) return;

      // Someone selecting an answer to copy is not trying to type.
      const selection = window.getSelection();
      if (selection && String(selection).length) return;

      box.focus();
    });

    if (box) {
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    // The suggestion strip scrolls sideways, but a plain mouse has no
    // horizontal wheel and the scrollbar is hidden. Translate a vertical
    // wheel into horizontal movement, and allow click and drag.
    const strip = document.querySelector(".quick-prompts");
    if (!strip) return;

    // Fade an end only when there is something past it.
    const updateFades = () => {
      const max = strip.scrollWidth - strip.clientWidth;
      strip.classList.toggle("fade-start", strip.scrollLeft > 4);
      strip.classList.toggle("fade-end", strip.scrollLeft < max - 4);
    };
    strip.addEventListener("scroll", updateFades, { passive: true });
    window.addEventListener("resize", updateFades);
    updateFades();

    strip.addEventListener("wheel", (e) => {
      const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (!delta) return;
      const before = strip.scrollLeft;
      strip.scrollLeft += delta;
      // Only swallow the event if the strip actually moved, so the page can
      // still scroll when the strip is already at its end.
      if (strip.scrollLeft !== before) e.preventDefault();
    }, { passive: false });

    let dragging = false, startX = 0, startScroll = 0, moved = 0;

    strip.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      dragging = true;
      moved = 0;
      startX = e.clientX;
      startScroll = strip.scrollLeft;
      strip.classList.add("dragging");
    });

    strip.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      strip.scrollLeft = startScroll - dx;
    });

    const endDrag = () => {
      dragging = false;
      strip.classList.remove("dragging");
    };
    strip.addEventListener("pointerup", endDrag);
    strip.addEventListener("pointerleave", endDrag);

    // A drag that moved should not also fire the button underneath it.
    strip.addEventListener("click", (e) => {
      if (moved > 6) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  });

  let firstBotMessageShown = false;

  // Kept so a thumbs rating can be filed against the question that produced it
  // and the checks that ran on it, rather than as a bare vote.
  let lastAnswerMeta = { question: "", notice: [] };

  // The conversation, so a follow-up can be understood as one.
  //
  // Asked "does Dr. Morgan go to this school" and then "who is he", the bot
  // used to answer the second question cold - it never saw the first. Every
  // request carried only the current line, so a pronoun had nothing to refer
  // back to and retrieval matched three function words against the corpus.
  //
  // Held here rather than on the server because the server has no sessions,
  // which is what lets it run on one free instance with several threads and no
  // store. Trimmed to the last few turns so a long conversation does not grow
  // the request without limit.
  let conversation = [];
  const HISTORY_TURNS = 6;
  function appendMessage(text, sender) {
    const msgContainer = document.getElementById("messages");

    // Create chat bubble
    const bubble = document.createElement("div");
    bubble.className = `chat-bubble ${sender}`;

    // Strip trailing newlines + parse markdown inline
    const trimmed = text.replace(/\n+$/, "");
    bubble.innerHTML = marked.parseInline(trimmed);

    msgContainer.appendChild(bubble);

    // No feedback control here. This path renders messages that were not
    // streamed, and it used to append a second "Was this message helpful?"
    // widget that only rewrote its own text - it posted nothing, so every
    // rating collected through it was discarded. The real one is built in the
    // streaming path, where the retrieval diagnostics the rating has to be
    // filed against actually exist.
    if (sender === "bot" && !firstBotMessageShown) {
      firstBotMessageShown = true;
    }

    // Auto-scroll
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }



  
  const overlay = document.getElementById("disclaimerOverlay");
  const dismissBtn = document.getElementById("disclaimerBtn");

  /* If user has already accepted, don't show the modal
  if (localStorage.getItem("vrhsDisclaimerAccepted") === "true") {
    overlay.style.display = "none";
  } else {
    overlay.style.display = "flex";
  } */ // UNCOMMENT THIS TO ENABLE DISCLAIMER KIND OF 

  dismissBtn.addEventListener("click", () => {
    // start closing animation
    overlay.classList.add("closing");
    localStorage.setItem("vrhsDisclaimerAccepted", "true");
  });

  // After transition ends, fully hide the element
  overlay.addEventListener("transitionend", (e) => {
    // make sure we only trigger when the overlay transition finishes
    if (e.target === overlay && overlay.classList.contains("closing")) {
      overlay.style.display = "none";
    }
  });


    function quickAsk(text) {
      document.getElementById("query").value = text;
      if (window.updateSendState) window.updateSendState();
      sendMessage();
    }

    function showOptionsModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('optionsModal').classList.toggle('open');
    }

    // Clicking anywhere else closes the menu, which is what a popover should
    // do and what the full-screen overlay used to handle.
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('optionsModal');
      if (!menu || !menu.classList.contains('open')) return;
      if (!menu.contains(e.target)) menu.classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const menu = document.getElementById('optionsModal');
        if (menu) menu.classList.remove('open');
      }
    });

    function showReportModal() {
      document.getElementById('optionsModal').classList.remove('open');
      document.getElementById('reportModal').style.display = 'block';
    }

    function hideReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    async function submitReport() {
      const description = document.getElementById('reportDescription').value;
      if (description.trim()) {
        try {
          const response = await fetch("/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ description: description.trim() })
          });
          
          if (response.ok) {
            document.getElementById('reportDescription').value = '';
            document.getElementById('optionsModal').style.display = 'none';
            document.getElementById('reportModal').style.display = 'none';
            showNotification('Thank you for your report. We will review it shortly.');
          } else {
            throw new Error('Failed to submit report');
          }
        } catch (error) {
          showNotification('Failed to submit report. Please try again.', 'error');
        }
      } else {
        showNotification('Please provide a description of the inaccuracy.', 'error');
      }
    }

    // Close modals when clicking outside
    window.onclick = function(event) {
      if (event.target.className === 'modal') {
        event.target.style.display = 'none';
      }
    }

    function showNotification(message, type = 'success') {
      const notificationDiv = document.getElementById('notification');
      notificationDiv.textContent = message;
      if (message === "Please provide a description of the inaccuracy.") {
        type = 'error';
      }
      notificationDiv.className = `notification ${type}`;
      requestAnimationFrame(() => {
        notificationDiv.classList.add('show');
      });
      setTimeout(() => {
        notificationDiv.classList.remove('show');
      }, 3000);
    }

    window.onload = function () {
      // Both of these are skipped in compact mode. The greeting is a turn in
      // the conversation that says nothing, and compact opens on an empty
      // screen where a lone "Hi!" is the only thing in it. The standing
      // disclaimer is redundant there too, because that skin gates the first
      // question behind one that has to be accepted.
      if (document.body.classList.contains("compact")) return;

      appendMessage("Hi! What can I help you with?", "bot");
      // Insert disclaimer right under the first bot message
      const chatMessages = document.querySelector(".chat-messages");
      const disclaimer = document.createElement("div");
      disclaimer.className = "mid-disclaimer";
      disclaimer.innerText = "Responses may be inaccurate. Check official VRHS or LISD sources for verified information.";
      chatMessages.appendChild(disclaimer);
      /* 
      appendMessage("Who are you?", "user");
      appendMessage("I am a chatbot designed to answer your questions about VRHS.", "bot"); */ 
      //appendMessage("What can you do?", "user");
      //appendMessage("I can answer questions about VRHS, such as where to find the calendar, how many hours you owe, and how to volunteer.", "bot");

    };

    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");

    // Clearing the box in code fires no "input" event, so the button used to
    // stay red after sending. Both paths now call the same updater.
    window.updateSendState = () => {
      const hasText = queryInput.value.trim() !== "";
      submitButton.style.backgroundColor = hasText ? "#e60023" : "#c9cdd2";
      submitButton.style.cursor = hasText ? "pointer" : "default";
    };

    queryInput.addEventListener("input", window.updateSendState);
    window.updateSendState();
  </script>
