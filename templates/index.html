      border: 1px solid #e3e5e8;
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -10px 40px rgba(32, 33, 36, 0.16);
      transform: translateY(100%);
      transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet.open .sheet-panel { transform: none; }

    /* The two notes' explanations: a small card in the middle of the
       window, on a phone as well as a desktop. They are a sentence or two,
       and a sheet rising from the bottom edge for that is a lot of motion
       for very little. Sources open the same way, a little wider for a
       list.
       The page behind is blurred and never darkened: the tint is white, and
       the card's own shadow is kept light and short so it does not pool into
       a grey halo. Instead the edges of the window glow faintly white on
       the inside, which frames the card by lifting the page rather than by
       shading it. */
    .sheet.center {
      align-items: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 0 60px 8px rgba(255, 255, 255, 0.85),
                  inset 0 0 14px 2px rgba(255, 255, 255, 0.9);
    }
    .sheet.center .sheet-panel {
      max-width: 380px;
      border: 1px solid #e3e5e8;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(32, 33, 36, 0.09),
                  0 1px 4px rgba(32, 33, 36, 0.05);
      opacity: 0;
      transform: translateY(10px) scale(0.97);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.22s ease;
    }
    .sheet.center.open .sheet-panel { opacity: 1; transform: none; }
    .sheet.center.sources .sheet-panel { max-width: 440px; }
    .sheet.center .sheet-body { padding-bottom: 20px; }

    .sheet-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 56px 10px 22px;
    }
    .sheet-head h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #202124;
    }

    .sheet-close {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #f1f3f4;
      color: #3c4043;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .sheet-close:hover { background: #e3e5e8; }
    .sheet-close svg { width: 16px; height: 16px; }

    /* The panel scrolls inside itself if a list of sources outgrows it; the
       page behind never does. */
    .sheet-body {
      padding: 4px 22px 22px 22px;
      overflow-y: auto;
      overscroll-behavior: contain;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #3c4043;
    }
    .sheet-body p { margin: 0 0 12px 0; }
    .sheet-body p:last-child { margin-bottom: 0; }
    .sheet-body .sheet-lead { font-size: 0.95rem; color: #202124; }

    .sheet-points { list-style: none; margin: 4px 0 14px 0; padding: 0; }
    .sheet-points li {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid #f1f3f4;
    }
    .sheet-points li:first-child { border-top: none; }
    .sheet-points .pt-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      /* Light grey, like the controls under an answer. Tinted blue and
         green they read as status badges - good news, done - which is more
         than a line of plain information should claim. */
      background: #f1f3f4;
      color: #5f6368;
    }
    .sheet-points .pt-icon svg { width: 15px; height: 15px; }
    .sheet-points strong {
      display: block;
      font-weight: 600;
      color: #202124;
      line-height: 1.35;
    }
    .sheet-points .pt-text { font-size: 0.84rem; line-height: 1.5; }

    /* Sources in the sheet: one group per site, each folding shut on its
       own. <details> rather than script, so it works for a keyboard and a
       screen reader with nothing added. */
    .src-group {
      border: 1px solid #e8eaed;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .src-group summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
      list-style: none;
      font-weight: 600;
      color: #202124;
      user-select: none;
    }
    .src-group summary::-webkit-details-marker { display: none; }
    .src-group summary .fav { box-shadow: none; }
    .src-group summary .n {
      margin-left: auto;
      font-weight: 400;
      font-size: 0.78rem;
      color: #80868b;
    }
    .src-group summary .chev {
      width: 16px;
      height: 16px;
      color: #80868b;
      transition: transform 0.2s ease;
    }
    .src-group[open] summary .chev { transform: rotate(180deg); }
    .src-group summary:hover { background: #f8f9fa; }

    .src-item {
      display: block;
      padding: 9px 14px 10px 44px;
      border-top: 1px solid #f1f3f4;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.13s ease;
    }
    .src-item:hover { background: #f8f9fa; }
    .src-item .t {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #c40020;
      font-weight: 500;
      font-size: 0.86rem;
    }
    .src-item .t svg { width: 12px; height: 12px; flex: 0 0 auto; }
    .src-item .s {
      display: block;
      margin-top: 2px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #5f6368;
    }

    /* The suggestion strip in this skin is written for the answer above it,
       so it shows those instead of the fixed openers, and they arrive as a
       row rather than all at once. The fixed ones come back in the other
       skins. */
    .quick-prompts .qp-tailored { display: none; }
    body.compact.v3 .quick-prompts.tailored > button:not(.qp-tailored) {
      display: none;
    }
    body.compact.v3 .quick-prompts .qp-tailored {
      display: inline-block;
      animation: suggestIn 0.26s ease both;
    }
    body.compact.v3 .quick-prompts .qp-tailored:nth-child(2) { animation-delay: 0.06s; }
    body.compact.v3 .quick-prompts .qp-tailored:nth-child(3) { animation-delay: 0.12s; }

    /* Gone while the answer is being written. They were written for the
       last answer, and offering them under a question that has moved on is
       offering the wrong things; they come back, rewritten, once the answer
       is complete. Faded where they stand rather than collapsed, so the
       composer does not jump up and back down again. */
    body.compact.v3 .quick-prompts.qp-away > button {
      animation: chipOut 0.22s ease both;
      pointer-events: none;
    }
    body.compact.v3 .quick-prompts.qp-away > button:nth-child(2) { animation-delay: 0.04s; }
    body.compact.v3 .quick-prompts.qp-away > button:nth-child(3) { animation-delay: 0.08s; }

    @keyframes chipOut {
      to { opacity: 0; transform: translateY(6px) scale(0.94); }
    }

    /* --- a short frame, on a phone ------------------------------------------
       The whole interface scaled, in three steps, when the frame is short -
       set by script as fit-1/2/3, see sizeFrame. zoom rather than transform,
       because zoom takes layout with it: a scaled-down composer that still
       occupied its full-size box would leave the space it was meant to give
       back. The sheets are outside the container, so they take the same
       step themselves.
       The composer's text is scaled back up to 16px on screen. iOS zooms the
       page into any focused field under 16px and does not zoom back out,
       which is the one thing a smaller interface must not trigger. */
    /* The conversation and the notices over it, not the landing screen:
       that one already sizes its headline and spacing by the frame's
       height, and scaling it again on top made the one screen with room to
       spare look shrunken. Gentler steps than the first version, which went
       to 0.62 and read as a different, smaller product. */
    body.compact.v3.fit-1:not(.awaiting) .chat-container,
    body.compact.v3.fit-1 .sheet-panel,
    body.compact.v3.fit-1 .disclaimer-card,
    body.compact.v3.fit-1 .fb-panel { zoom: 0.92; }
    body.compact.v3.fit-2:not(.awaiting) .chat-container,
    body.compact.v3.fit-2 .sheet-panel,
    body.compact.v3.fit-2 .disclaimer-card,
    body.compact.v3.fit-2 .fb-panel { zoom: 0.84; }
    body.compact.v3.fit-3:not(.awaiting) .chat-container,
    body.compact.v3.fit-3 .sheet-panel,
    body.compact.v3.fit-3 .disclaimer-card,
    body.compact.v3.fit-3 .fb-panel { zoom: 0.77; }
    body.compact.v3.fit-1:not(.awaiting) .chat-input input,
    body.compact.v3.fit-1 .fb-panel .fb-input { font-size: calc(16px / 0.92); }
    body.compact.v3.fit-2:not(.awaiting) .chat-input input,
    body.compact.v3.fit-2 .fb-panel .fb-input { font-size: calc(16px / 0.84); }
    body.compact.v3.fit-3:not(.awaiting) .chat-input input,
    body.compact.v3.fit-3 .fb-panel .fb-input { font-size: calc(16px / 0.77); }

    /* --- the "what went wrong" panel, on a phone ---------------------------
       Sized for a cursor, it took most of a phone's width and its comment
       box a third of its height. Tighter throughout.
       The comment box is the awkward one. Its text has to be 16px as far as
       iOS is concerned, or tapping it zooms the page - the embedding page,
       too, when this is in an iframe. So it stays 16px and is drawn at 0.8
       with a transform, which iOS does not count: a font-size is what it
       checks, and a transform does not change one. A transform does not
       change layout either, so the box is made 1/0.8 as wide to come out
       the panel's width, and gives back the height it no longer shows
       through a negative margin worked from its real height, which fit()
       keeps in --h. */
    @media (max-width: 720px), (pointer: coarse) {
      body.compact.v3 .fb-panel {
        width: 232px;
        padding: 10px;
        gap: 7px;
        border-radius: 12px;
      }
      body.compact.v3 .fb-title { font-size: 0.64rem; }
      body.compact.v3 .fb-reasons { gap: 5px; }
      body.compact.v3 .fb-reason {
        font-size: 0.7rem;
        line-height: 16px;
        padding: 2px 8px;
      }
      body.compact.v3 .fb-send {
        font-size: 0.72rem;
        line-height: 16px;
        min-height: 26px;
        padding: 4px 12px;
      }
      body.compact.v3 .fb-hint { font-size: 0.64rem; }
      body.compact.v3 .fb-panel .fb-input {
        --ts: 0.8;
        min-height: 44px;
        width: calc(100% / var(--ts));
        max-width: none;
        transform: scale(var(--ts));
        transform-origin: 0 0;
        margin-bottom: calc(var(--h, 44px) * (var(--ts) - 1));
      }
      /* In a short frame the panel is zoomed down, and its comment box's
         font is raised to keep 16px as iOS measures it - which left the
         placeholder the one thing in the panel that did not shrink. The
         drawing scale takes the zoom out again: 0.8 times the step, so the
         text lands where it would if it had been zoomed with the rest. */
      body.compact.v3.fit-1 .fb-panel .fb-input { --ts: 0.736; }
      body.compact.v3.fit-2 .fb-panel .fb-input { --ts: 0.672; }
      body.compact.v3.fit-3 .fb-panel .fb-input { --ts: 0.616; }

      /* A tiny frame - 440px and under - has no room for the suggestion
         strip: at that height it was a third of what was left for the
         conversation. The composer and the answer are what matter there. */
      body.compact.v3.fit-2:not(.awaiting) .quick-prompts,
      body.compact.v3.fit-3:not(.awaiting) .quick-prompts { display: none; }

      /* And the three cards come in tight enough to read without scrolling:
         less padding, smaller type, one line of each source's quotation
         instead of two or three. The panel is zoomed down already; this is
         the room the zoom alone did not find. */
      body.compact.v3.fit-2 .sheet.center,
      body.compact.v3.fit-3 .sheet.center { padding: 10px; }
      body.compact.v3.fit-2 .sheet-head,
      body.compact.v3.fit-3 .sheet-head { padding: 12px 46px 6px 16px; }
      body.compact.v3.fit-2 .sheet-head h3,
      body.compact.v3.fit-3 .sheet-head h3 { font-size: 0.9rem; }
      body.compact.v3.fit-2 .sheet-close,
      body.compact.v3.fit-3 .sheet-close {
        top: 8px; right: 8px; width: 30px; height: 30px;
      }
      body.compact.v3.fit-2 .sheet-body,
      body.compact.v3.fit-3 .sheet-body {
        padding: 2px 16px 14px 16px;
        font-size: 0.8rem;
        line-height: 1.45;
      }
      body.compact.v3.fit-2 .sheet-body .sheet-lead,
      body.compact.v3.fit-3 .sheet-body .sheet-lead { font-size: 0.84rem; }
      body.compact.v3.fit-2 .sheet-points,
      body.compact.v3.fit-3 .sheet-points { margin: 0; }
      body.compact.v3.fit-2 .sheet-points li,
      body.compact.v3.fit-3 .sheet-points li { padding: 6px 0; gap: 10px; }
      body.compact.v3.fit-2 .sheet-points .pt-icon,
      body.compact.v3.fit-3 .sheet-points .pt-icon { width: 26px; height: 26px; }
      body.compact.v3.fit-2 .sheet-points .pt-text,
      body.compact.v3.fit-3 .sheet-points .pt-text { font-size: 0.78rem; line-height: 1.4; }
      body.compact.v3.fit-2 .src-group,
      body.compact.v3.fit-3 .src-group { margin-bottom: 6px; border-radius: 11px; }
      body.compact.v3.fit-2 .src-group summary,
      body.compact.v3.fit-3 .src-group summary { padding: 7px 12px; font-size: 0.8rem; }
      body.compact.v3.fit-2 .src-item,
      body.compact.v3.fit-3 .src-item { padding: 6px 12px 7px 40px; }
      body.compact.v3.fit-2 .src-item .t,
      body.compact.v3.fit-3 .src-item .t { font-size: 0.8rem; }
      body.compact.v3.fit-2 .src-item .s,
      body.compact.v3.fit-3 .src-item .s {
        font-size: 0.74rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    /* --- back to the end ----------------------------------------------------
       A thumb scrolling up through a long answer has no scrollbar to grab
       and a long way to flick back, and the scrollbar here is hidden for a
       mouse too, so every screen gets it. The circle is frosted rather than
       solid, so the text it floats over still reads through it as text
       rather than being blotted out.
       Centred on a desktop or a tablet, under the conversation it belongs
       to. On a phone, at the right-hand end of the row instead, where the
       thumb already is. */
    .to-end { display: none; }
    body.compact.v3:not(.awaiting) .to-end {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 6;
      width: 38px;
      height: 38px;
      margin-left: -19px;
      padding: 0;
      border: 1px solid rgba(32, 33, 36, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      -webkit-backdrop-filter: blur(10px) saturate(1.4);
      backdrop-filter: blur(10px) saturate(1.4);
      box-shadow: 0 4px 14px rgba(32, 33, 36, 0.14);
      color: #3c4043;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px) scale(0.9);
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0s linear 0.24s;
    }
    body.compact.v3:not(.awaiting) .to-end.show {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0s linear 0s;
    }
    .to-end svg { width: 18px; height: 18px; }

    /* A phone by width, not by pointer: an iPad is a touch screen too, and
       it keeps the centred button like a desktop. */
    @media (max-width: 720px) {
      body.compact.v3:not(.awaiting) .to-end {
        left: auto;
        right: 18px;
        margin-left: 0;
      }
    }

    /* Lower in a short frame. 34px up is a real share of a conversation
       only a couple of hundred pixels tall, and the button sat in the
       middle of the text it was offering to skip. Shown only once the
       reader has scrolled up, which is when the notes it would crowd are
       already stepping aside for the text under them. */
    body.compact.v3.fit-1:not(.awaiting) .to-end { bottom: 26px; }
    body.compact.v3.fit-2:not(.awaiting) .to-end { bottom: 18px; }
    body.compact.v3.fit-3:not(.awaiting) .to-end { bottom: 10px; }

    @media (prefers-reduced-motion: reduce) {
      .sheet, .sheet-panel, body.compact.v3:not(.awaiting) .chat-input,
      .to-end { transition: none; }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>
<body{% if compact %} class="compact awaiting{% if v3 %} v3{% endif %}"{% endif %}>
  <div class="chat-container">
    <div class="chat-header">
      <span>Ask Your Questions Here!</span>
      <span class="options-button" onclick="showOptionsModal(event)">⋮</span>
    </div>
    <!-- Options Modal -->
    <div id="optionsModal" class="options-menu">
      <button onclick="showReportModal()" class="report-button">Report Inaccuracies</button>
      <div class="options-credit">Built by Saif Syed &amp; Junayd Elhassan</div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal" class="modal">
      <div class="modal-content report-modal">
        <h2>Report Inaccuracy</h2>
        <textarea id="reportDescription" placeholder="Describe the inaccuracy..."></textarea>
        <div class="modal-buttons">
          <button onclick="submitReport()" class="submit-button">Submit</button>
          <button onclick="hideReportModal()" class="cancel-button">Cancel</button>
        </div>
      </div>
    </div>


    <!-- Disclaimer Modal -->
    <div id="disclaimerOverlay" class="disclaimer-overlay">
      <div class="disclaimer-card">
        <div class="disclaimer-icon">
          <img src="https://cdn.jsdelivr.net/gh/SaifSyed08/vrhs-chatbot-assets/vrhs-logo.jpg" alt="VRHS Logo">
        </div>
        <p>Chatbot responses may be inaccurate & do not constitute official policy.</p>
        <button id="disclaimerBtn" class="disclaimer-button">I understand →</button>
      </div>
    </div>
    
    <div class="chat-messages" id="messages"></div>
    <!-- The third skin's two notes, floated over the foot of the message
         list. A zero-height row, so the layout of the other skins is not
         touched by it existing. Anchors rather than buttons because a second
         copy lives inside .chat-input, where every <button> is restyled as
         the round send control. -->
    <div class="ai-notes-row">
      <!-- Back to the newest message. Third skin, phones only; see
           .to-end. -->
      <button type="button" class="to-end" aria-label="Scroll to the latest message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/></svg>
      </button>
      <div class="ai-notes">
        <a href="#" class="ai-note" role="button" data-sheet="privacy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
          <span>Your privacy</span>
        </a>
        <a href="#" class="ai-note" role="button" data-sheet="ai">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></svg>
          <span>How AI works</span>
        </a>
      </div>
    </div>
    <div class="quick-prompts">
      <button onclick="quickAsk('Where do I find the calendar?')">Where do I find the calendar?</button>
      <button onclick="quickAsk('Where are the bell schedules?')">Where are the bell schedules?</button>
      <button onclick="quickAsk('Where can I find bus information?')">Where can I find bus information?</button>

      <!-- Fourth rather than second or last. Ingest now reads the A/B
           calendar's Drive filename, so the bot can tell 2026-2027 from
           2025-2026 and answers this properly - but it is still a narrower
           question than the calendar or bell schedules, so it does not lead. -->
      <button onclick="quickAsk('Is tomorrow an A day or B day?')">Is tomorrow an A day or B day?</button>
      <button onclick="quickAsk('How can I sign up for ACC classes?')">How can I sign up for ACC classes?</button>
      <button onclick="quickAsk('How can I start a club?')">How can I start a club?</button>
      <button onclick="quickAsk('When does the ML Club meet?')">When does the ML Club meet?</button>

      <button onclick="quickAsk('How do I get a parking permit?')">How do I get a parking permit?</button>
      <button onclick="quickAsk('How can I make up hours?')">How can I make up hours?</button>
      <button onclick="quickAsk('Where is the attendance website?')">Where is the attendance website?</button>
      <button onclick="quickAsk('Where is the library website?')">Where is the library website?</button>

    </div>
    <div class="chat-input">
      <!-- Landing-screen heading. Only rendered in compact mode's opening
           state; the CSS hides it everywhere else, so the default interface is
           untouched. -->
      <div class="landing-title">
        Can't find what you're looking for?
        <span>Ask below and I'll check the school's pages.</span>
      </div>

      <div class="input-pill">
        <!-- The travelling outline. pathLength="100" makes the dash lengths
             mean percentages of the perimeter, so one set of numbers works
             whatever width the composer takes. -->
        <svg class="pill-snake" aria-hidden="true" focusable="false"
             preserveAspectRatio="none">
          <rect x="1" y="1" pathLength="100" />
        </svg>
        <input type="text" id="query" placeholder="Ask about VRHS..."
               autocomplete="off" aria-label="Ask a question" />
        <button onclick="sendMessage()" id="submitButton" aria-label="Send">
          <!-- An arrow up rather than a paper plane. The plane is a
               filled glyph pointing sideways on a round button, which reads
               as play more than as send, and it sat visually off-centre
               because its mass is all on the left. An up arrow is what a
               composer means by send now, it is symmetrical in a circle, and
               it is the same stroke weight as the arrow in the hover panel -
               one going up to send, one going out to leave. -->
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
               stroke="white" stroke-width="2.4" stroke-linecap="round"
               stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M12 5L5.5 11.5M12 5l6.5 6.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="notification" class="notification"></div>
  </div>

    <script>
      // Inline markdown, plus the one block form an answer actually uses.
      //
      // marked.parseInline renders no block markup at all - it is the right
      // call for a stream, where the buffer is flushed in pieces and a block
      // parser would rewrite the whole answer on every token - but it means
      // "### Bell schedules" reached the reader as those literal characters.
      // Headings are line-shaped, so they can be handled a line at a time
      // without giving up the streaming parser: the line becomes one span,
      // its text still goes through parseInline so bold and links inside it
      // work, and the newlines survive for white-space: pre-line.
      function renderInline(text) {
        return text.split("\n").map(function (line) {
          const h = /^\s{0,3}(#{1,6})\s+(.*)$/.exec(line);
          if (!h) return marked.parseInline(line);
          const body = h[2].replace(/\s*#+\s*$/, "");
          return '<span class="answer-h" data-level="' + h[1].length + '">'
               + marked.parseInline(body) + "</span>";
        }).join("\n");
      }

      // helper from before
      function splitTokens(text) {
        const tokens = [];
        let cur = "", inLink = false;
        for (let ch of text) {
          if (ch === '[')        { inLink = true;  cur += ch; }
          else if (ch === ')' && inLink) { cur += ch; inLink = false; }
          else if (/\s/.test(ch) && !inLink) {
            if (cur) { tokens.push(cur); cur = ""; }
            tokens.push(ch);
          } else cur += ch;
        }
        if (cur) tokens.push(cur);
        return tokens;
      }

      // A cursor-following panel, shared by source pills and by the links
      // inside an answer. Appended to the body rather than to the element it
      // describes: as a child it inherits the message list's clipping, and
      // fixed positioning only escapes that from the top of the document.
      function attachTip(el, text, external) {
        const tip = document.createElement("span");
        tip.className = "pill-tip";
        // textContent, not innerHTML. This is text scraped off the web and
        // must never be parsed as markup - which is also why the arrow below
        // is appended as its own element rather than concatenated into the
        // string.
        tip.textContent = text;

        if (external) {
          // The panel already says "Opens the district site", and a reader
          // skimming it takes the words in after the shape. An arrow leaving
          // the box is the shape every other interface uses for "this leaves
          // the page", and it is legible before the sentence is.
          const arrow = document.createElementNS(
            "http://www.w3.org/2000/svg", "svg");
          arrow.setAttribute("class", "tip-arrow");
          arrow.setAttribute("viewBox", "0 0 24 24");
          arrow.setAttribute("aria-hidden", "true");
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", "M7 17L17 7M17 7H9M17 7V15");
          arrow.appendChild(path);
          tip.appendChild(arrow);
        }

        document.body.appendChild(tip);

        const place = (e) => {
          const pad = 14;
          let x = e.clientX + pad;
          let y = e.clientY + pad;
          const box = tip.getBoundingClientRect();
          if (x + box.width > window.innerWidth - 8) {
            x = e.clientX - box.width - pad;
          }
          if (y + box.height > window.innerHeight - 8) {
            y = e.clientY - box.height - pad;
          }
          tip.style.left = Math.max(8, x) + "px";
          tip.style.top = Math.max(8, y) + "px";
        };

        el.addEventListener("mouseenter", (e) => {
          place(e);
          tip.classList.add("show");
        });
        el.addEventListener("mousemove", place);
        el.addEventListener("mouseleave", () => tip.classList.remove("show"));
      }

      // Where a link in an answer goes, in the same words the source pills
      // use. A reader deciding whether to click deserves to know it is about
      // to open a Google Doc without having to read the URL.
      function describeLink(href) {
        let host;
        try {
          host = new URL(href, window.location.href).hostname;
        } catch (err) {
          return null;
        }
        const friendly = {
          "docs.google.com": "Opens Google Doc",
          "drive.google.com": "Opens Google Drive file",
          "sites.google.com": "Opens Google Site",
          "calendar.google.com": "Opens Google Calendar",
          "forms.gle": "Opens Google Form",
          "www.leanderisd.org": "Opens the district site",
          "leanderisd.org": "Opens the district site",
          "news.leanderisd.org": "Opens district news",
          "vrhs.leanderisd.org": "Opens the school site"
        };
        return friendly[host] || ("Opens " + host);
      }

      // The clipboard, with the old route behind it. navigator.clipboard
      // needs a secure context and, inside an embedding page's iframe, that
      // page's permission - neither of which this widget controls. A hidden
      // textarea and execCommand still works in both places it does not.
      //
      // Synchronous first, now. This used to ask navigator.clipboard and fall
      // back only once it had been refused - and embedded, it is refused
      // unless the host page grants clipboard-write, sometimes slowly while
      // the browser decides. The fallback then ran late, outside the click
      // that allowed it, and the tick came late or not at all: "I have to
      // click it a few times". A copy event raised inside the click itself
      // needs no permission, no selection and no focus change, and it has
      // succeeded or failed before the click handler returns.
      function copyText(text) {
        let viaEvent = false;
        const onCopy = (e) => {
          e.clipboardData.setData("text/plain", text);
          e.preventDefault();
          viaEvent = true;
        };
        document.addEventListener("copy", onCopy, true);
        try { document.execCommand("copy"); } catch (err) { viaEvent = false; }
        document.removeEventListener("copy", onCopy, true);
        if (viaEvent) return Promise.resolve(true);

        // A selected hidden box, for browsers that raise no copy event from
        // execCommand. Not readonly: iOS will not select text in a readonly
        // field, so that version copied nothing on a phone. 16px so iOS does
        // not zoom to it for the instant it has focus.
        const viaSelection = () => {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.opacity = "0";
          ta.style.fontSize = "16px";
          document.body.appendChild(ta);
          ta.focus({ preventScroll: true });
          ta.select();
          ta.setSelectionRange(0, text.length);
          let ok = false;
          try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
          ta.remove();
          return ok;
        };
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text)
            .then(() => true, () => viaSelection());
        }
        return Promise.resolve(viaSelection());
      }

      // What a source is, for labelling it: a key to group by, a name to
      // show, and an icon.
      //
      // Google's products are told apart by path as well as host. Docs,
      // Sheets, Slides and Forms all live on docs.google.com, and the favicon
      // service answers every one of them with the same "G" - so a stack of
      // three sources read as three of one thing when it was a schedule, a
      // spreadsheet and a form. Each gets its product's own icon, from
      // Google's static host, and its own group in the sources sheet.
      const G_ICON = "https://ssl.gstatic.com/images/branding/product/1x/";
      const SITE_NAMES = {
        "vrhs.leanderisd.org": "Vista Ridge High School",
        "leanderisd.org": "Leander ISD",
        "news.leanderisd.org": "Leander ISD news"
      };
      function siteOf(url) {
        let u;
        try { u = new URL(url, window.location.href); }
        catch (err) { return { key: "", label: "", icon: "", host: "" }; }
        const host = u.hostname.replace(/^www\./, "");
        const path = u.pathname;
        const google = (key, label) => ({ key: key, label: label, host: host,
          icon: G_ICON + key + "_2020q4_32dp.png" });
        if (host === "docs.google.com") {
          if (path.startsWith("/spreadsheets")) return google("sheets", "Google Sheets");
          if (path.startsWith("/presentation")) return google("slides", "Google Slides");
          if (path.startsWith("/forms")) return google("forms", "Google Forms");
          return google("docs", "Google Docs");
        }
        if (host === "forms.gle") return google("forms", "Google Forms");
        if (host === "drive.google.com") return google("drive", "Google Drive");
        if (host === "sites.google.com") return google("sites", "Google Sites");
        if (host === "calendar.google.com") return google("calendar", "Google Calendar");
        return { key: host, label: SITE_NAMES[host] || host, host: host,
                 icon: "https://www.google.com/s2/favicons?sz=64&domain="
                       + encodeURIComponent(host) };
      }

      // A source's icon in a small disc. Google's products get their own
      // (see siteOf); anything else comes from Google's favicon service,
      // because the school and district sites serve theirs from paths that
      // differ page to page. If it fails to load, the disc shows the site's
      // first letter rather than a broken image.
      function makeFav(url) {
        const site = siteOf(url);
        const disc = document.createElement("span");
        disc.className = "fav";
        disc.setAttribute("aria-hidden", "true");
        if (!site.icon) return disc;
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.src = site.icon;
        img.addEventListener("error", () => {
          img.remove();
          disc.textContent = site.label.charAt(0).toUpperCase();
        });
        disc.appendChild(img);
        return disc;
      }

      function createFeedbackElement(bubble) {
        // Rewritten from a full-width block that announced itself with "Was
        // this helpful?" and sat on its own line under every answer. Three
        // things were wrong with it: the question is cognitive load on someone
        // who came here to read an answer, the controls were larger than the
        // source pills they sat under, and a rating could not be changed once
        // given - a misclick was permanent.
        //
        // Now it is two small icons that live on the same line as the sources,
        // stay invisible until the answer is hovered, and can be changed as
        // often as the reader likes.
        const fb = document.createElement("div");
        fb.className = "feedback-inline";

        fb.innerHTML = `
          <button type="button" class="fb-btn fb-copy" title="Copy answer" aria-label="Copy answer">
            <svg class="ic-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/>
              <path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/>
            </svg>
            <svg class="ic-done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5"/>
            </svg>
          </button>
          <div class="fb-rate">
          <button class="fb-btn" data-type="up" title="Helpful" aria-label="Helpful">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 10C3 9.44772 3.44772 9 4 9H7V21H4C3.44772 21 3 20.5523 3 20V10Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V19L8.9923 20.3282C9.64937 20.7662 10.4214 21 11.2111 21H16.4586C17.9251 21 19.1767 19.9398 19.4178 18.4932L20.6119 11.3288C20.815 10.1097 19.875 9 18.6391 9H14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 9L14.6872 5.56415C14.8659 4.67057 14.3512 3.78375 13.4867 3.49558C12.6336 3.21122 11.7013 3.59741 11.2992 4.4017L8 11H7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="fb-btn" data-type="down" title="Not helpful" aria-label="Not helpful">
            <svg viewBox="0 0 24 24" fill="none" style="transform: rotate(180deg);" aria-hidden="true">
              <path d="M3 10C3 9.44772 3.44772 9 4 9H7V21H4C3.44772 21 3 20.5523 3 20V10Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V19L8.9923 20.3282C9.64937 20.7662 10.4214 21 11.2111 21H16.4586C17.9251 21 19.1767 19.9398 19.4178 18.4932L20.6119 11.3288C20.815 10.1097 19.875 9 18.6391 9H14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 9L14.6872 5.56415C14.8659 4.67057 14.3512 3.78375 13.4867 3.49558C12.6336 3.21122 11.7013 3.59741 11.2992 4.4017L8 11H7" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          </div>
        `;

        // The panel sits inside the icon row, immediately after the thumbs.
        // As a separate block underneath it appeared a long way from the
        // button that opened it, and the connection between clicking
        // thumbs-down and three chips showing up elsewhere was not obvious.
        const panel = document.createElement("div");
        panel.className = "fb-panel";
        panel.hidden = true;
        panel.setAttribute("role", "dialog");
        panel.setAttribute("aria-label", "What went wrong");
        panel.innerHTML = `
          <div class="fb-title">What went wrong?</div>
          <div class="fb-reasons">
            <button type="button" class="fb-reason" data-reason="not_found">Didn't find it</button>
            <button type="button" class="fb-reason" data-reason="not_up_to_date">Out of date</button>
            <button type="button" class="fb-reason" data-reason="inaccurate">Inaccurate</button>
          </div>
          <div class="fb-comment">
            <textarea class="fb-input" maxlength="1000" rows="2"
                      placeholder="Anything else? (optional)"></textarea>
            <span class="fb-hint"></span>
          </div>
          <div class="fb-actions">
            <button type="button" class="fb-send">Submit</button>
          </div>
        `;
        // Parented to the body, not to the footer. See the CSS note: the
        // conversation scrolls, so anything positioned inside it is clipped
        // at its edge - which is exactly where the newest answer sits.
        document.body.appendChild(panel);
        fb.panel = panel;

        // The rating buttons only. The copy button is an .fb-btn too, for
        // its looks, and is not a vote.
        const buttons = fb.querySelectorAll(".fb-btn[data-type]");
        const reasons = panel.querySelectorAll(".fb-reason");
        const input = panel.querySelector(".fb-input");
        const hint = panel.querySelector(".fb-hint");
        const sendBtn = panel.querySelector(".fb-send");

        // Anchored under the thumbs-down and pulled back inside the viewport
        // if that would hang it off an edge. Measured from the button every
        // time rather than remembered, because the conversation scrolls
        // underneath it and a phone rotates.
        const place = () => {
          const anchor = fb.querySelector('.fb-btn[data-type="down"]')
                         || fb;
          const a = anchor.getBoundingClientRect();
          const box = panel.getBoundingClientRect();
          const margin = 12;

          // The visual viewport, not the layout one, when the browser offers
          // it. They are the same until a phone zooms or raises a keyboard,
          // and then they are not: clamping a fixed element to innerWidth
          // while the reader is looking at a zoomed-in slice puts it off the
          // side of what they can actually see, which reads as the panel
          // vanishing rather than as it being somewhere else.
          const vv = window.visualViewport;
          const viewW = vv ? vv.width : window.innerWidth;
          const viewH = vv ? vv.height : window.innerHeight;
          const offX = vv ? vv.offsetLeft : 0;
          const offY = vv ? vv.offsetTop : 0;

          // Right edge of the panel under the right edge of the button, so
          // it opens back across the answer rather than off the side.
          let left = a.right - box.width;
          left = Math.min(left, offX + viewW - box.width - margin);
          left = Math.max(offX + margin, left);

          let top = a.bottom + 8;
          if (top + box.height > offY + viewH - margin) {
            // No room below: flip above the button, and if there is no room
            // there either, sit against the top edge.
            top = Math.max(offY + margin, a.top - box.height - 8);
          }
          // In the panel's own units. On a short phone frame the panel is
          // zoomed down with the rest of the third skin, and a zoomed
          // element's left and top are zoomed too - the measurements above
          // are screen pixels, so written back as they are they would place
          // it at 0.77 of where it belongs.
          const z = parseFloat(getComputedStyle(panel).zoom) || 1;
          panel.style.left = Math.round(left / z) + "px";
          panel.style.top = Math.round(top / z) + "px";
        };

        let outside = null;
        const onScroll = () => {
          if (document.activeElement === panel.querySelector(".fb-input")) {
            return;
          }
          place();
        };

        const closePanel = () => {
          if (panel.hidden) return;
          panel.classList.remove("open");
          if (outside) {
            document.removeEventListener("pointerdown", outside, true);
            document.removeEventListener("keydown", outside, true);
            window.removeEventListener("resize", place);
            window.removeEventListener("scroll", onScroll, true);
            if (window.visualViewport) {
              window.visualViewport.removeEventListener("resize", place);
            }
            outside = null;
          }
          // Hidden only once the fade has finished, or the panel vanishes on
          // the frame the class comes off and there is nothing to watch.
          setTimeout(() => {
            if (!panel.classList.contains("open")) panel.hidden = true;
          }, 200);
        };
        fb.closePanel = closePanel;

        const openPanel = () => {
          panel.hidden = false;
          // Placed before the class goes on, so it fades in where it belongs
          // rather than sliding across from wherever it was measured.
          place();
          requestAnimationFrame(() => {
            panel.classList.add("open");
            place();
          });

          outside = (e) => {
            if (e.type === "keydown") {
              if (e.key === "Escape") { closePanel(); }
              return;
            }
            if (panel.contains(e.target) || fb.contains(e.target)) return;
            closePanel();
          };
          document.addEventListener("pointerdown", outside, true);
          document.addEventListener("keydown", outside, true);
          window.addEventListener("resize", place);
          // Capture, so the conversation scrolling underneath moves it too -
          // but not while the comment box has focus. A phone scrolls the page
          // as it raises the keyboard, and re-anchoring to a button that is
          // being pushed off screen drags the panel away with it.
          window.addEventListener("scroll", onScroll, true);
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", place);
          }
        };

        // Captured now, because lastAnswerMeta moves on to the next answer.
        const context = lastAnswerMeta;

        // One id for this answer's feedback, sent with every post about it.
        // A thumbs-down files immediately - a reader who shrugs and leaves
        // should still be counted - and then the reason and the comment
        // arrive seconds later as a second post. Both used to open their own
        // GitHub issue, so every complaint was filed twice and the pair had
        // to be read together to find out what the reader actually said. The
        // id is what lets the server recognise the second post as more of the
        // first and edit the issue it already opened.
        const fid = "fb-" + Date.now().toString(36) + "-"
                  + Math.random().toString(36).slice(2, 10);
        let rating = null;
        let reason = null;

        const post = (comment) => {
          fetch("/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              feedback_id: fid,
              question: context.question,
              answer: context.answer || null,
              rating: rating,
              reason: reason,
              comment: comment || null,
              retrieval_level: (context.retrieval || {}).level || null,
              retrieval_top: (context.retrieval || {}).top || null,
              flagged: (context.notice || []).length > 0
            })
          }).catch(err => console.warn("feedback not recorded", err));
        };

        buttons.forEach(btn => {
          btn.addEventListener("click", () => {
            const type = btn.dataset.type;

            // Clicking the active rating clears it. A rating is an opinion and
            // opinions get withdrawn; the previous version treated the first
            // click as final, so a misclick could not be taken back.
            if (rating === type) {
              rating = null;
              reason = null;
              btn.classList.remove("active");
              closePanel();
              return;
            }

            rating = type;
            reason = null;
            buttons.forEach(b => b.classList.toggle("active", b === btn));

            if (type === "up") {
              closePanel();
              post(null);
              return;
            }

            // Negative: ask what went wrong, but file the rating immediately.
            // Waiting for a reason meant a reader who shrugged and moved on
            // was recorded as never having rated at all.
            post(null);
            reasons.forEach(r => r.classList.remove("active"));
            input.value = "";
            fit();
            hint.className = "fb-hint";
            hint.textContent = "";
            sendBtn.className = "fb-send";
            sendBtn.textContent = "Submit";
            openPanel();
            // Deliberately not focused. Autofocusing outlined the box the
            // instant thumbs-down was clicked, which reads as a demand for an
            // explanation before the rating counts. It already counted.
          });
        });

        // A chip is the submission. There was a Send button next to the text
        // box, which made a reader who had already clicked "Inaccurate" wonder
        // whether their click had counted - the answer being that it had, and
        // the button was for something else. Clicking a chip files it, and
        // Enter files whatever has been typed. Nothing needs confirming twice.
        // Picking a chip no longer files anything on its own. It used to,
        // and that was right when a chip was the only control in the row -
        // but a panel with a Submit button in it makes two ways to send one
        // rating, and a reader who picks a reason and then types a sentence
        // would have filed twice.
        reasons.forEach(option => {
          option.addEventListener("click", () => {
            const already = reason === option.dataset.reason;
            reason = already ? null : option.dataset.reason;
            reasons.forEach(r => r.classList.toggle("active",
                                                    !already && r === option));
          });
        });

        // Submit files whatever is set, confirms in place, and takes the
        // panel away. The rating itself was already filed when thumbs-down
        // was pressed, so this is never the difference between counted and
        // not - it is the difference between a bare vote and one with a
        // reason attached.
        const submit = () => {
          if (sendBtn.classList.contains("done")) return;
          post(input.value.trim());
          sendBtn.classList.add("done");
          sendBtn.textContent = "\u2713 Submitted";
          hint.className = "fb-hint show done";
          hint.textContent = "Submitted anonymously \u2713";
