        b.addEventListener("mousedown", function (e) {
          e.preventDefault();
          // Fills the box; does not send. Picking a suggestion is choosing
          // what to ask, not deciding to ask it - the reader may want to
          // change a word first, and sending on the same click takes that
          // away with no way back.
          box.value = q;
          box.focus();
          close();
          if (window.updateSendState) window.updateSendState();
        });

        panel.appendChild(b);
        items.push(b);
      });

      if (reused) {
        resize();
      } else {
        // A fresh panel opens from nothing, which needs the browser to see the
        // zero height before the real one.
        requestAnimationFrame(resize);
      }
    };

    // Not on a phone. The keyboard takes half of an already short frame, and
    // a list opening under the composer is a list opening under the keyboard
    // - or, embedded, off the bottom of the frame, which is the one thing
    // this screen must not do.
    const phone = window.matchMedia("(max-width: 720px), (pointer: coarse)");

    // How many rows fit between the composer and the bottom of the frame.
    // This skin is embedded in pages that give it little height, and the
    // frame clips rather than scrolls, so a third row that does not fit is a
    // row cut in half. Measured, because the room depends on the frame.
    const ROW = 39;
    const room = function () {
      const below = window.innerHeight - pill.getBoundingClientRect().bottom
                    - 6 - 8;
      return Math.max(0, Math.min(MAX, Math.floor(below / ROW)));
    };

    const update = function () {
      const typed = box.value.trim().toLowerCase();
      const body = document.body;
      if (!body.classList.contains("compact")
          || !body.classList.contains("awaiting")
          || typed.length < 2 || phone.matches) {
        close();
        return;
      }
      // Substring anywhere, so "club" finds "How do I start a new club?" and
      // not only the questions that happen to open with it.
      const hits = QUESTIONS.filter(function (q) {
        return q.toLowerCase().indexOf(typed) !== -1;
      }).slice(0, room());
      render(hits, typed);
    };

    const move = function (step) {
      if (!items.length) return;
      cursor = (cursor + step + items.length) % items.length;
      items.forEach(function (b, i) {
        b.classList.toggle("active", i === cursor);
        b.setAttribute("aria-selected", i === cursor ? "true" : "false");
      });
    };

    box.addEventListener("input", update);
    box.addEventListener("focus", update);
    box.addEventListener("blur", function () { setTimeout(close, 120); });

    box.addEventListener("keydown", function (e) {
      if (!items.length) return;
      if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
      else if (e.key === "Escape") { close(); }
      else if (e.key === "Enter" && cursor >= 0) {
        // Enter on a highlighted suggestion fills the box, matching what a
        // click does. A second Enter sends it, which is the same two steps a
        // reader takes when typing the question out.
        e.preventDefault();
        items[cursor].dispatchEvent(new MouseEvent("mousedown"));
      }
    });
  })();
  </script>

<script>
  // ===================================================================
  // The placeholder.
  // ===================================================================
  // One controller, because everything here writes to the same property and
  // two timers doing that is a half-erased Spanish sentence with an English
  // question typing itself over the top.
  //
  //   Landing, first seen   "Try asking here" types itself out a character
  //                         at a time, then its ellipsis animates
  //   Landing, idle         the prompt crossfades through four languages,
  //                         the ellipsis still going underneath
  //   Hovered, fine pointer a real question types itself out, as before
  //   In conversation       "Ask about VRHS..." and nothing moves
  //   Focused or typing     nothing moves, permanently
  //
  // The landing text and the conversation text are different on purpose. "Try
  // asking here" is an invitation and belongs on an empty screen; once there
  // are answers above it the control is a control, and a composer that keeps
  // coaxing is a composer that is still selling itself after the sale.
  //
  // Always English first, and typed out rather than simply present, because
  // the typing is what makes somebody look at it. An IntersectionObserver is
  // what makes "first seen" a real event: this thing is built to be embedded,
  // so it is routinely below the fold of a page it does not own, and starting
  // the animation on load would mean it had finished before anybody scrolled
  // to it.
  (function () {
    const pill = document.querySelector(".input-pill");
    const box = document.getElementById("query");
    if (!pill || !box) return;

    const CHAT_PROMPT = box.getAttribute("placeholder") || "Ask about VRHS...";

    // Bases without the dots. The dots are animated separately, so every
    // language gets them without four copies of the same three strings.
    const LANGS = [
      "Try asking here",
      "Prueba a preguntar aquí",
      "यहाँ पूछकर देखें",
      "在这里提问吧"
    ];
    const DOTS = [".", "..", "..."];

    const TYPE_MS = 55;      // per character of the opening line
    const DOT_MS = 420;      // one, two, three
    const IDLE_MS = 3200;    // in view and untouched before the languages
    const HOLD_MS = 2800;    // each language
    const FADE_MS = 260;     // matches the ::placeholder colour transition

    const CARET = "|";
    const Q_TYPE_MS = 42;
    const Q_ERASE_MS = 22;
    const Q_HOLD_MS = 1600;
    const GAP_MS = 220;
    const BLINK_MS = 530;

    const still = window.matchMedia("(prefers-reduced-motion: reduce)");
    const coarse = window.matchMedia("(pointer: coarse)");

    let timer = null;      // the one-shot in whatever sequence is running
    let dotTimer = null;   // the ellipsis, which runs under the others
    let blinker = null;
    let mode = "rest";     // rest | intro | langs | questions
    let done = false;      // the reader has taken the box; nothing runs again
    let inView = false;
    let hovering = false;
    let langAt = 0;
    let dotAt = 0;
    let base = LANGS[0];

    // The landing screen is the only place the invitation belongs.
    const landing = () => document.body.classList.contains("compact")
                          && document.body.classList.contains("awaiting");

    const resting = () => (landing() ? LANGS[0] + DOTS[2] : CHAT_PROMPT);

    const clearAll = function () {
      clearTimeout(timer);
      clearTimeout(dotTimer);
      clearInterval(blinker);
      timer = dotTimer = blinker = null;
    };

    const setText = function (t) { box.setAttribute("placeholder", t); };

    // Checked on every tick, not just at the start: focus and typing happen
    // mid-word and the box has to come back the moment they do.
    function ready() {
      return !done && inView && landing() && !box.value
             && document.activeElement !== box;
    }

    // --- the ellipsis ------------------------------------------------------
    // Runs underneath whichever language is showing, so switching language is
    // only ever a change of `base`.
    const tickDots = function () {
      if (!ready() || (mode !== "langs" && mode !== "intro")) return;
      dotAt = (dotAt + 1) % DOTS.length;
      setText(base + DOTS[dotAt]);
      dotTimer = setTimeout(tickDots, DOT_MS);
    };

    const startDots = function () {
      clearTimeout(dotTimer);
      dotAt = 2;
      dotTimer = setTimeout(tickDots, DOT_MS);
    };

    // --- the opening line, typed -------------------------------------------
    const typeIntro = function (i) {
      if (!ready() || mode !== "intro") { rest(); return; }
      setText(LANGS[0].slice(0, i));
      if (i < LANGS[0].length) {
        timer = setTimeout(function () { typeIntro(i + 1); }, TYPE_MS);
        return;
      }
      base = LANGS[0];
      startDots();
      timer = setTimeout(startLangs, IDLE_MS);
    };

    const startIntro = function () {
      if (!ready()) return;
      clearAll();
      mode = "intro";
      box.classList.remove("ph-fade");
      if (still.matches) {
        // Asked not to animate: the finished sentence, and nothing moving.
        setText(resting());
        mode = "rest";
        return;
      }
      typeIntro(0);
    };

    // --- the language rotation ---------------------------------------------
    const nextLang = function () {
      if (!ready() || mode !== "langs") { rest(); return; }
      langAt = (langAt + 1) % LANGS.length;
      // Fade the text out, change it underneath, fade it back. The dots keep
      // their own time through all of it.
      box.classList.add("ph-fade");
      timer = setTimeout(function () {
        if (!ready() || mode !== "langs") { rest(); return; }
        base = LANGS[langAt];
        setText(base + DOTS[dotAt]);
        box.classList.remove("ph-fade");
        timer = setTimeout(nextLang, HOLD_MS);
      }, FADE_MS);
    };

    const startLangs = function () {
      if (!ready() || still.matches) return;
      clearTimeout(timer);
      mode = "langs";
      langAt = 0;
      startDots();
      timer = setTimeout(nextLang, HOLD_MS);
    };

    // --- the hover question typer ------------------------------------------
    let order = [];
    let at = 0;
    let text = "";
    let caretOn = true;

    const paint = function () { setText(text + (caretOn ? CARET : " ")); };

    const blink = function (on) {
      clearInterval(blinker);
      blinker = null;
      caretOn = true;
      if (on) {
        blinker = setInterval(function () { caretOn = !caretOn; paint(); },
                              BLINK_MS);
      }
    };

    const shuffled = function () {
      const list = (window.VRHS_QUESTIONS || []).slice();
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = list[i]; list[i] = list[j]; list[j] = t;
      }
      return list;
    };

    const typing = () => mode === "questions" && ready() && hovering;

    const eraseTo = function (target, whenDone) {
      if (!typing()) { rest(); return; }
      if (text.length > target.length
          || text.slice(0, target.length) !== target) {
        text = text.slice(0, -1);
        paint();
        timer = setTimeout(function () { eraseTo(target, whenDone); },
                           Q_ERASE_MS);
      } else { whenDone(); }
    };

    const typeTo = function (target, whenDone) {
      if (!typing()) { rest(); return; }
      if (text.length < target.length) {
        text = target.slice(0, text.length + 1);
        paint();
        timer = setTimeout(function () { typeTo(target, whenDone); },
                           Q_TYPE_MS);
      } else { whenDone(); }
    };

    const cycle = function () {
      if (!typing()) { rest(); return; }
      blink(false);
      typeTo(order[at], function () {
        if (!typing()) { rest(); return; }
        blink(true);
        timer = setTimeout(function () {
          if (!typing()) { rest(); return; }
          blink(false);
          eraseTo("", function () {
            at = (at + 1) % order.length;
            timer = setTimeout(cycle, GAP_MS);
          });
        }, Q_HOLD_MS);
      });
    };

    const startQuestions = function () {
      if (!ready() || still.matches || coarse.matches) return;
      order = shuffled();
      if (!order.length) return;
      clearAll();
      mode = "questions";
      at = 0;
      text = box.getAttribute("placeholder") || "";
      caretOn = true;
      box.classList.remove("ph-fade");
      blink(false);
      eraseTo("", function () { timer = setTimeout(cycle, GAP_MS); });
    };

    // --- back to nothing ---------------------------------------------------
    const rest = function () {
      clearAll();
      mode = "rest";
      const want = resting();
      if (box.getAttribute("placeholder") === want) {
        box.classList.remove("ph-fade");
        return;
      }
      // Faded, not swapped. Going from a half-typed question to the resting
      // prompt between one frame and the next reads as a glitch rather than
      // as the animation ending.
      box.classList.add("ph-fade");
      timer = setTimeout(function () {
        setText(want);
        box.classList.remove("ph-fade");
      }, FADE_MS);
    };

    // The reader has taken the box. Nothing animates it again.
    const surrender = function () { done = true; rest(); };

    box.addEventListener("focus", surrender);
    box.addEventListener("input", surrender);

    pill.addEventListener("mouseenter", function () {
      hovering = true;
      if (coarse.matches || !ready()) return;
      startQuestions();
    });
    pill.addEventListener("mouseleave", function () {
      hovering = false;
      if (done || !inView) return;
      clearAll();
      mode = "rest";
      base = LANGS[0];
      setText(resting());
      box.classList.remove("ph-fade");
      timer = setTimeout(startIntro, GAP_MS);
    });

    // --- in view, or not ---------------------------------------------------
    const enter = function () {
      if (inView) return;
      inView = true;
      if (done) return;
      clearAll();
      mode = "rest";
      base = LANGS[0];
      box.classList.remove("ph-fade");
      if (!landing()) { setText(CHAT_PROMPT); return; }
      // Empty, so the typing has somewhere to start from.
      setText("");
      timer = setTimeout(startIntro, 260);
    };

    const leave = function () {
      inView = false;
      clearAll();
      mode = "rest";
      base = LANGS[0];
      setText(resting());
      box.classList.remove("ph-fade");
    };

    if (window.IntersectionObserver) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { enter(); } else { leave(); }
        });
      }, { threshold: 0.4 }).observe(pill);
    } else {
      enter();
    }

    // Once a question has been asked the composer stops being an invitation,
    // and the class on <body> is what says so.
    //
    // Watched rather than hooked. The obvious version wraps window.leaveLanding
    // and does the swap there, and it cannot be made to work from here: that
    // function is defined by a later script block, so wrapping it inline
    // captures undefined, and wrapping it on a timeout races the definition -
    // the timeout fires first, the later block overwrites the wrapper, and
    // the hook is simply never called. It fails silently, which is how it
    // survived a browser test that only checked the end state a second later.
    //
    // The class is the fact the wrapper was reaching for anyway, and watching
    // it works whatever order the scripts load in and whichever path removed
    // it - typing, a quick prompt, or anything added later.
    let wasLanding = landing();
    new MutationObserver(function () {
      const now = landing();
      if (now === wasLanding) return;
      wasLanding = now;
      if (now) return;
      done = true;
      clearAll();
      mode = "rest";
      box.classList.remove("ph-fade");
      setText(CHAT_PROMPT);
    }).observe(document.body, { attributes: true,
                                attributeFilter: ["class"] });
  })();
  </script>

<script>
  // ===================================================================
  // The landing headline, in a frame too short for it.
  // ===================================================================
  // The headline is its full size unless the frame cannot hold it and the
  // composer together - an embed a couple of hundred pixels tall - and then
  // it steps down only as far as it has to. A size tied to the frame's
  // height shrank it in frames that had room, and a headline left at full
  // size in one that did not pushed the composer off the bottom, where a
  // phone lets the frame be scrolled to it even with scrolling turned off.
  // Measured rather than predicted, because the headline wraps to two lines
  // on a phone and one on a desktop, and a smaller size can take a line
  // back.
  (function () {
    const body = document.body;
    const title = document.querySelector(".landing-title");
    const row = document.querySelector(".chat-input");
    const pill = document.querySelector(".input-pill");
    if (!title || !row || !pill) return;

    const fitLanding = () => {
      title.style.fontSize = "";
      if (!body.classList.contains("compact")
          || !body.classList.contains("awaiting")) return;
      for (let i = 0; i < 8; i++) {
        const gap = parseFloat(getComputedStyle(title).marginBottom) || 0;
        const room = row.clientHeight - pill.offsetHeight - gap - 8;
        const size = parseFloat(getComputedStyle(title).fontSize);
        if (title.offsetHeight <= room || size <= 16) break;
        // Proportional, then one pixel at a time if a rewrap undid it.
        const next = Math.max(16, Math.min(size - 1,
          Math.floor(size * room / title.offsetHeight)));
        title.style.fontSize = next + "px";
      }
    };

    fitLanding();
    window.addEventListener("resize", fitLanding);
    // Oswald arrives after first paint, and it sets narrower than the
    // fallback, so the measurement taken before it is not the one that
    // counts.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitLanding);
    }
    new MutationObserver(fitLanding).observe(body,
      { attributes: true, attributeFilter: ["class"] });
  })();
  </script>

<script>
  // ===================================================================
  // Keep the outline a pill.
  // ===================================================================
  // rx and ry on a <rect> are clamped independently - rx to half the width,
  // ry to half the height - so a large value does not mean "fully rounded",
  // it means an ellipse as wide as the box and as tall as the box. The only
  // value that draws a pill is half the height, and the height changes
  // between skins, on focus, and when the landing screen collapses. So it is
  // measured rather than guessed, and re-measured whenever the box resizes.
  (function () {
    const pill = document.querySelector(".input-pill");
    const rect = document.querySelector(".pill-snake rect");
    if (!pill || !rect) return;

    const fit = () => {
      // Half the rect's own height, measured. Measured rather than derived
      // from the pill, because the SVG's offsets resolve inside the pill's
      // border and the border's rendered width depends on the screen's pixel
      // density - a formula from offsetHeight was a pixel out, and a radius a
      // pixel over half the height is clamped on one axis only, which draws
      // an oval.
      // getBBox, not getBoundingClientRect: rx is in the SVG's own units,
      // and the bounding rect is in screen pixels. They agree until the
      // interface is zoomed down for a short frame, and then the screen
      // measure is the zoomed one - a radius 0.62 of what it should be, and
      // corners visibly squarer than the pill they trace.
      let h = 0;
      try { h = rect.getBBox().height; } catch (err) { h = 0; }
      if (!h) h = rect.ownerSVGElement.getBoundingClientRect().height - 2;
      const r = Math.max(0, h / 2);
      rect.setAttribute("rx", r);
      rect.setAttribute("ry", r);
    };

    // Touch has no hover, so the tap does it. Held long enough for the
    // outline to finish drawing itself - the animation is the point, and a
    // class removed on pointerup would cut it in half.
    if (window.matchMedia("(hover: none), (pointer: coarse)").matches) {
      let off = null;
      pill.addEventListener("pointerdown", () => {
        pill.classList.add("snake-on");
        clearTimeout(off);
        off = setTimeout(() => pill.classList.remove("snake-on"), 2200);
      });
    }

    fit();
    if (window.ResizeObserver) {
      new ResizeObserver(fit).observe(pill);
    } else {
      window.addEventListener("resize", fit);
      pill.addEventListener("focusin", fit);
      pill.addEventListener("focusout", fit);
    }
  })();
  </script>

<script>
  // ===================================================================
  // The ranger.
  // ===================================================================
  (function () {
    let busy = false;

    window.summonRanger = function () {
      // One at a time. Asking twice while he is still on screen should not
      // produce two of him walking through each other.
      if (busy) return;
      const rail = document.querySelector(".input-pill");
      if (!rail) return;
      busy = true;

      const stage = document.createElement("div");
      stage.className = "ranger-stage";
      stage.setAttribute("aria-hidden", "true");

      const el = document.createElement("div");
      el.className = "ranger walking";
      // Just off the edge - one sprite width plus a little, so the stage's
      // clip hides him and no further.
      el.style.left = "-46px";
      stage.appendChild(el);
      rail.appendChild(stage);

      // How far he walks is a share of the rail rather than a pixel count, so
      // the trip makes sense on a phone and on a wide window. The duration is
      // derived from the distance to hold his speed constant - a fixed
      // duration would have him sprinting across a large screen.
      // A short entrance. At 16% of the rail he was still walking well after
      // the reader had worked out what was happening; the wave is the part
      // worth watching, so the trip to it should be brief.
      const stop = Math.max(20, Math.round(rail.clientWidth * 0.07));
      // Slower on a phone. Speed is in pixels and the rail is a third as
      // wide there, so the same number crosses the visible strip in a
      // fraction of the time and he registers as a flicker rather than as a
      // character. The walk cycle is 0.72s whatever the screen, so at 112
      // px/s on a 360px rail he was off again before finishing two strides.
      const narrow = window.matchMedia("(max-width: 720px)").matches;
      const speed = narrow ? 64 : 112; // px/s, matched to the stride
      const walkMs = Math.round((stop + 46) / speed * 1000);

      requestAnimationFrame(() => {
        el.style.transition = "left " + walkMs + "ms linear";
        el.style.left = stop + "px";
      });

      const leave = () => {
        el.classList.remove("waving");
        el.classList.add("walking", "leaving");
        el.style.transition = "left " + walkMs + "ms linear";
        el.style.left = "-46px";
        setTimeout(() => { stage.remove(); busy = false; }, walkMs + 150);
      };

      const wave = () => {
        el.classList.remove("walking");
        el.classList.add("waving");
        setTimeout(leave, 1500);
      };

      setTimeout(wave, walkMs + 80);
    };
  })();
  </script>

<script>
  // ===================================================================
  // The third skin: sheets, the two notes, and the composer rising.
  // ===================================================================
  (function () {
    const body = document.body;
    const msgs = document.getElementById("messages");
    const box = document.getElementById("query");
    const v3 = () => body.classList.contains("compact")
                     && body.classList.contains("v3");

    const svg = (inner) =>
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '
      + 'aria-hidden="true">' + inner + "</svg>";

    const ICON = {
      lock: svg('<rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/>'
                + '<path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>'),
      clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      link: svg('<path d="M7 17L17 7M17 7H9M17 7V15"/>'),
      chev: svg('<path d="M6 9l6 6 6-6"/>'),
      close: svg('<path d="M6 6l12 12M18 6L6 18"/>')
    };

    // --- the sheet ---------------------------------------------------------
    // Built when asked for and removed when closed, so the page carries no
    // hidden dialog for the two skins that never show one.
    let current = null;

    // centered: a card in the middle of the window rather than a sheet from
    // the bottom edge, on any screen - see .sheet.center.
    function openSheet(title, centered, fill) {
      if (current) current(true);

      const wrap = document.createElement("div");
      wrap.className = centered ? "sheet center" : "sheet";
      if (title === "Sources") wrap.classList.add("sources");
      const panel = document.createElement("div");
      panel.className = "sheet-panel";
      panel.setAttribute("role", "dialog");
      panel.setAttribute("aria-modal", "true");
      panel.setAttribute("aria-labelledby", "sheet-title");

      const head = document.createElement("div");
      head.className = "sheet-head";
      // The title alone. An icon beside it repeated the one on the note
      // that opened it.
      head.innerHTML = '<h3 id="sheet-title"></h3>';
      head.querySelector("h3").textContent = title;

      const x = document.createElement("button");
      x.type = "button";
      x.className = "sheet-close";
      x.setAttribute("aria-label", "Close");
      x.innerHTML = ICON.close;

      const content = document.createElement("div");
      content.className = "sheet-body";
      fill(content);

      panel.append(head, x, content);
      wrap.appendChild(panel);
      document.body.appendChild(wrap);

      const before = document.activeElement;
      // One frame at the closed state first, or there is nothing to animate
      // from and the sheet appears already up.
      requestAnimationFrame(() => wrap.classList.add("open"));

      const onKey = (e) => {
        if (e.key === "Escape") { e.stopPropagation(); close(); }
      };

      const close = (instant) => {
        if (current !== close) return;
        current = null;
        document.removeEventListener("keydown", onKey, true);
        if (instant) { wrap.remove(); return; }
        wrap.classList.remove("open");
        setTimeout(() => wrap.remove(), 420);
        // Back to what opened it, except the composer on a phone - focusing
        // that raises the keyboard nobody asked for.
        if (before && before !== box && before.focus) {
          before.focus({ preventScroll: true });
        }
      };
      current = close;

      x.addEventListener("click", () => close());
      wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
      document.addEventListener("keydown", onKey, true);
      x.focus({ preventScroll: true });
    }

    const para = (el, text, cls) => {
      const p = document.createElement("p");
      if (cls) p.className = cls;
      p.textContent = text;
      el.appendChild(p);
      return p;
    };

    const points = (el, rows) => {
      const ul = document.createElement("ul");
      ul.className = "sheet-points";
      rows.forEach(r => {
        const li = document.createElement("li");
        li.innerHTML = '<span class="pt-icon ' + (r.tone || "") + '">'
                     + r.icon + '</span><div class="pt-text"><strong></strong>'
                     + "<span></span></div>";
        li.querySelector("strong").textContent = r.title;
        li.querySelector(".pt-text span").textContent = r.text;
        ul.appendChild(li);
      });
      el.appendChild(ul);
    };

    // Every line here has to be true of this deployment, because it is a
    // promise made to students about their data. Checked against the code:
    // the server has no sessions and keeps no transcript, the conversation
    // is held in this page's memory and sent back with each question, and
    // the process log records at most the first sixty characters of a
    // question for debugging. OpenAI's API terms are the stated retention
    // for the model. Short on purpose - two points a reader takes in at a
    // glance, not a policy.
    // Centred cards on a desktop, not sheets: short enough to read in one
    // look, so nothing in them should ever need scrolling.
    const SHEETS = {
      ai: ["How AI works", true, (el) => {
        para(el, "This site uses AI to explain school and district "
               + "information from official sources. It can miss details or "
               + "be out of date, so check the linked sources before making "
               + "decisions.", "sheet-lead");
      }],
      privacy: ["Your privacy", true, (el) => {
        points(el, [
          { icon: ICON.lock, tone: "", title: "Secure",
            text: "Encrypted, with no sign-in." },
          { icon: ICON.clock, tone: "", title: "Limited retention",
            // Not "our AI providers do not retain your prompts". The API
            // keeps requests for up to 30 days for abuse monitoring unless
            // the account has Zero Data Retention, which this one does not
            // have; if that is ever granted, this line can say so.
            text: "No chat history is kept. Our AI provider doesn't train "
                + "on what you ask, and keeps it only for a limited time "
                + "for safety checks." }
        ]);
      }]
    };

    // Delegated, so both copies of the notes - landing and conversation -
    // are covered by one handler. Anchors, so Space has to be added; Enter
    // already clicks.
    document.addEventListener("click", (e) => {
      const note = e.target.closest && e.target.closest(".ai-note");
      if (!note) return;
      e.preventDefault();
      const def = SHEETS[note.dataset.sheet];
      if (def) openSheet(def[0], def[1], def[2]);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== " ") return;
      const note = e.target.closest && e.target.closest(".ai-note");
      if (!note) return;
      e.preventDefault();
      note.click();
    });

    // --- sources, by site ----------------------------------------------------
    window.openSourcesSheet = function (sources) {
      // Grouped by site - by product, for Google's, so Docs and Sheets are
      // two groups though they share a host - in the order their best source
      // was ranked, so the one the answer leaned on most comes first.
      const groups = [];
      const byKey = {};
      sources.forEach(src => {
        const site = siteOf(src.url);
        const key = site.key || "other";
        if (!byKey[key]) {
          byKey[key] = { site: site, url: src.url, items: [] };
          groups.push(byKey[key]);
        }
        byKey[key].items.push(src);
      });

      openSheet("Sources", true, (el) => {
        groups.forEach(g => {
          const d = document.createElement("details");
          d.className = "src-group";
          d.open = true;
          const sum = document.createElement("summary");
          sum.appendChild(makeFav(g.url));
          const name = document.createElement("span");
          name.textContent = g.site.label || "Other";
          name.title = g.site.host;
          sum.appendChild(name);
          const n = document.createElement("span");
          n.className = "n";
          n.textContent = g.items.length === 1 ? "1 page"
                                               : g.items.length + " pages";
          sum.appendChild(n);
          sum.insertAdjacentHTML("beforeend",
            ICON.chev.replace("<svg", '<svg class="chev"'));
          d.appendChild(sum);

          g.items.forEach(src => {
            const a = document.createElement("a");
            a.className = "src-item";
            a.href = src.url;
            a.target = "_blank";
            a.rel = "noopener";
            const t = document.createElement("span");
            t.className = "t";
            t.textContent = src.label || src.url;
            t.insertAdjacentHTML("beforeend", ICON.link);
            a.appendChild(t);
            if (src.snippet) {
              const sn = document.createElement("span");
              sn.className = "s";
              sn.textContent = src.snippet;
              a.appendChild(sn);
            }
            d.appendChild(a);
          });
          el.appendChild(d);
        });
      });
    };

    // --- the notes step aside over text -------------------------------------
    // Checked against the lines of text themselves, not the boxes they sit
    // in. An answer in this skin is a full-width block, and its last line is
    // often short: testing the block would hide a note that is plainly over
    // white space beside that line.
    const notes = document.querySelectorAll(".ai-notes-row .ai-note");
    const toEnd = document.querySelector(".to-end");
    if (toEnd && msgs) {
      toEnd.addEventListener("click", () => {
        msgs.scrollTo({ top: msgs.scrollHeight, behavior: "smooth" });
      });
    }
    const SOLID = ".chat-bubble.user, .typing-indicator, .verify-card, "
                + ".source-pills, .source-stack, .feedback-inline, "
                + ".mid-disclaimer";
    const range = document.createRange();

    const overlaps = (a, b, pad) =>
      b.width > 0 && b.height > 0
      && b.bottom > a.top - pad && b.top < a.bottom + pad
      && b.right > a.left - pad && b.left < a.right + pad;

    let queued = false;
    const check = () => {
      queued = false;
      if (!v3() || body.classList.contains("awaiting") || !msgs) return;
      const rects = [];
      msgs.querySelectorAll(".chat-bubble.bot").forEach(el => {
        range.selectNodeContents(el);
        for (const r of range.getClientRects()) rects.push(r);
      });
      msgs.querySelectorAll(SOLID).forEach(el => {
        rects.push(el.getBoundingClientRect());
      });
      notes.forEach(n => {
        const r = n.getBoundingClientRect();
        n.classList.toggle("covered", rects.some(b => overlaps(r, b, 4)));
      });
      // Up by more than about a screen's worth of a phone's conversation.
      // Less than that and the end is a short flick away already.
      if (toEnd) {
        const behind = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight;
        toEnd.classList.toggle("show", behind > 240);
      }
    };
    const soon = () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(check);
    };

    if (msgs) {
      msgs.addEventListener("scroll", soon, { passive: true });
      new MutationObserver(soon).observe(msgs, {
        childList: true, subtree: true, characterData: true });
    }
    window.addEventListener("resize", soon);
    new MutationObserver(soon).observe(body, {
      attributes: true, attributeFilter: ["class"] });

    // --- the composer rises, and the conversation keeps its end in view -----
    // The rise itself is CSS: the space under the composer grows on focus
    // and the message list gives up that height. What the CSS cannot do is
    // keep the last line where the reader was looking, so whenever the list
    // changes size while it was scrolled to the end, it is put back there.
    // Instant rather than smooth: the list is smooth-scrolling by default,
    // and a smooth correction every frame of a transition trails behind it.
    let atEnd = true;
    // Called by the send path when, on a touch screen, it has chosen to
    // stop at the question rather than follow the answer to the end. The
    // list's own scroll event arrives a frame or more later - the list
    // scrolls smoothly - and until then this still believed the reader was
    // at the end, so every frame of the composer's rise, which is still
    // animating as the first answer lands, dragged the list back down to
    // the bottom past the question it had just stopped at.
    window.releaseEnd = () => { atEnd = false; };
    if (msgs) {
      msgs.addEventListener("scroll", () => {
        atEnd = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 28;
      }, { passive: true });
      if (window.ResizeObserver) {
        new ResizeObserver(() => {
          if (!v3() || !atEnd) return;
          msgs.scrollTo({ top: msgs.scrollHeight, behavior: "instant" });
          soon();
        }).observe(msgs);
      }
    }

    // --- the keyboard, on a phone -------------------------------------------
    // The page is a fixed frame sized to the window, and a phone keyboard
    // does not change the window: iOS, and Android unless told otherwise,
    // lay the keyboard over the page and pan the whole document up to keep
    // the focused field in sight. That pan is what swallowed the composer's
    // rise - the box went up with everything else, including the answer the
    // reader was trying to keep in view.
    //
    // The visual viewport is the part not under the keyboard. The frame is
    // sized to that instead while the keyboard is up, and the pan put back to
    // zero, so the composer sits directly on the keyboard, rises from there,
    // and the conversation shrinks above it with its end still in view.
    //
    // Not when the reader has pinch-zoomed: the visual viewport shrinks then
    // too, and resizing the page to a zoomed slice of itself would be wrong.
    // Inside an iframe the visual viewport never reports a keyboard, so this
    // does nothing there and the embedding page decides.
    const vv = window.visualViewport;
    if (vv) {
      const root = document.documentElement;
      let frame = 0;
      const fitKeyboard = () => {
        frame = 0;
        const zoomed = Math.abs((vv.scale || 1) - 1) > 0.01;
        const covered = window.innerHeight - vv.height;
        if (!zoomed && covered > 80) {
          root.style.height = Math.round(vv.height) + "px";
          root.classList.add("kb-up");
          if (window.scrollY || vv.offsetTop) window.scrollTo(0, 0);
        } else if (root.classList.contains("kb-up")) {
          root.style.height = "";
          root.classList.remove("kb-up");
        }
      };
      const onViewport = () => {
        if (!frame) frame = requestAnimationFrame(fitKeyboard);
      };
      vv.addEventListener("resize", onViewport);
      vv.addEventListener("scroll", onViewport);
    }

    // --- a short frame, on a phone ------------------------------------------
    // Embedded in a page that gives it a strip a few hundred pixels tall, or
    // on a phone turned on its side, the third skin at its normal size is
    // mostly composer and suggestions with a sliver of conversation between.
    // So it scales down, in steps, as the frame gets shorter.
    //
    // Measured by script rather than by a media query, and only while the
    // composer does not have focus. Android shrinks the window when the
    // keyboard opens, and a height query would see that as a short frame and
    // shrink everything under the reader's thumb every time they went to
    // type; a height taken before they did stays put until they are done.
    const phoneish = window.matchMedia("(max-width: 720px), (pointer: coarse)");
    const FITS = [[340, "fit-3"], [440, "fit-2"], [560, "fit-1"]];
    const sizeFrame = () => {
      if (box && document.activeElement === box) return;
      const h = window.innerHeight;
      const step = phoneish.matches
        ? (FITS.find(f => h <= f[0]) || [0, ""])[1] : "";
      FITS.forEach(f => body.classList.toggle(f[1], f[1] === step));
    };
    sizeFrame();
    window.addEventListener("resize", sizeFrame);
    if (box) box.addEventListener("blur", () => setTimeout(sizeFrame, 300));

    // --- suggestions written for the last answer ---------------------------
    // The server writes three from the pages the answer was retrieved from
    // when this skin asks it to. When it has none - a pre-written answer, a
    // question the pages do not cover, a slow or failed call - the landing
    // list is ranked against the question and the answer instead, so the
    // strip still moves on with the conversation and still only offers
    // things the site can answer.
    const STOP = new Set(("the a an and or of to in on for is are do does "
      + "did i my me we you your how what where when who which can could "
      + "with at by from this that it be as about there here get find "
      + "school vrhs vista ridge").split(" "));
    const norm = (t) => String(t || "").toLowerCase()
                          .replace(/[^a-z0-9 ]+/g, " ").trim()
                          .replace(/\s+/g, " ");
    const words = (t) => norm(t).split(" ")
                          .filter(w => w.length > 2 && !STOP.has(w))
                          .map(w => w.replace(/s$/, ""));

    const ranked = (question, answer, skip) => {
      const inQ = new Set(words(question));
      const inA = new Set(words(answer));
      return (window.VRHS_QUESTIONS || [])
        .filter(q => !skip.has(norm(q)))
        .map(q => {
          let score = 0;
          new Set(words(q)).forEach(w => {
            if (inA.has(w)) score += 1;
            if (inQ.has(w)) score += 1.5;
          });
          return { q: q, score: score };
        })
        .filter(x => x.score >= 1.5)
        .sort((a, b) => b.score - a.score)
        .map(x => x.q);
    };

    window.stashPrompts = function () {
      const strip = document.querySelector(".quick-prompts");
      if (strip) strip.classList.add("qp-away");
    };
    window.unstashPrompts = function () {
      const strip = document.querySelector(".quick-prompts");
      if (strip) strip.classList.remove("qp-away");
    };

    window.tailorPrompts = function (question, answer, followups) {
      const strip = document.querySelector(".quick-prompts");
      if (!strip) return;
      strip.classList.remove("qp-away");

      const skip = new Set();
      (typeof conversation !== "undefined" ? conversation : [])
        .forEach(t => { if (t.role === "user") skip.add(norm(t.content)); });
      skip.add(norm(question));

      // The same question in other words counts as asked. Exact matching
      // let "What time does the school day end?" through straight after
      // "What time does school end?" had been answered.
      const askedWords = [...skip].map(q => new Set(words(q)));
      const same = (q) => {
        const w = new Set(words(q));
        return askedWords.concat(list.map(x => new Set(words(x))))
          .some(a => {
            let both = 0;
            w.forEach(x => { if (a.has(x)) both++; });
            const either = new Set([...w, ...a]).size;
            return either > 0 && both / either >= 0.6;
          });
      };

      const list = [];
      const add = (q) => {
        const k = norm(q);
        if (!k || skip.has(k) || same(q)) return;
        list.push(q);
      };
      (Array.isArray(followups) ? followups : [])
        .filter(q => typeof q === "string").forEach(add);
      if (list.length < 3) ranked(question, answer, skip).forEach(add);

      strip.querySelectorAll(".qp-tailored").forEach(b => b.remove());
      const chosen = list.slice(0, 3);
      chosen.slice().reverse().forEach(q => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "qp-tailored";
        b.textContent = q;
        b.addEventListener("click", () => quickAsk(q));
        strip.prepend(b);
      });
      strip.classList.toggle("tailored", chosen.length > 0);
      strip.scrollLeft = 0;
      strip.dispatchEvent(new Event("scroll"));
    };
  })();
  </script>

<script>
  // ===================================================================
  // Compact mode and the disclaimer.
  // ===================================================================
  (function () {
    const body = document.body;

    // The 2 key switches skins, and has to be caught before the type-anywhere
    // handler - that one fires when nothing is focused, which is exactly when
    // this one wants the key, and it would otherwise put a "2" in the
    // composer. Once the composer has focus, 2 is a character again, so a
    // question containing a number types normally.
    //
    // 3 does the same for the third skin, which is compact with overrides on
    // top: on from anywhere, and off back to compact. 2 pressed in the third
    // skin also lands in compact - 2 is the second skin - and from there
    // toggles to classic as it always has.
    document.addEventListener("keydown", (e) => {
      if ((e.key !== "2" && e.key !== "3")
          || e.ctrlKey || e.metaKey || e.altKey) return;
      const active = document.activeElement;
      const tag = active && active.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (active && active.isContentEditable) return;

      e.preventDefault();
      e.stopImmediatePropagation();

      if (e.key === "3" || body.classList.contains("v3")) {
        const on = e.key === "3" && !body.classList.contains("v3");
        body.classList.toggle("v3", on);
        body.classList.add("compact");
        if (!window.__asked) body.classList.add("awaiting");
        return;
      }

      body.classList.toggle("compact");

      // Entering compact with nothing asked yet drops to the landing state.
      // Leaving never does, because a conversation is already on screen.
      if (body.classList.contains("compact") && !window.__asked) {
        body.classList.add("awaiting");
      } else {
        body.classList.remove("awaiting");
        // First arrival in the classic skin is the first time its standing
        // notice is due. On /widget that is the only way it is ever due.
        if (window.showStandingDisclaimer) window.showStandingDisclaimer();
      }
    }, true);

    // A one-way trip, taken by the first question rather than by a timer.
    window.leaveLanding = function () {
      window.__asked = true;
      body.classList.remove("awaiting");
    };

    // Shown on the first send, not on load. A notice that appears before
    // anyone has done anything is furniture and gets dismissed unread; one
    // that appears as the first question goes out is about that question.
    // It blocks, which is the point - it is not a toast.
    let accepted = false;

    window.requireDisclaimer = function (proceed) {
      // Compact mode only. The default interface already carries its own
      // notice, and two disclaimers for one product is one disclaimer nobody
      // reads.
      if (!body.classList.contains("compact")) return true;
      if (accepted) return true;

      const wrap = document.createElement("div");
      wrap.className = "disclaimer";
      // Joined with nothing, so every line carries its own trailing space and
      // none carry leading indentation.
      //
      // The previous version was indented for readability and joined the same
      // way, which put five spaces inside the sentence at every line break -
      // "Vista Ridge High School     website" - and six between the button's
      // label and its arrow. HTML collapses runs of whitespace when it paints,
      // so it looked right and was not: the runs are in the DOM, so they are
      // what a screen reader reads, what a copy-paste carries, and what any
      // measurement of the text sees.
      wrap.innerHTML = [
        '<div class="disclaimer-card" role="dialog" aria-modal="true" ',
        'aria-labelledby="disclaimer-title">',
        '<h3 id="disclaimer-title">Before you ask</h3>',
        '<p>This assistant answers from pages on the Vista Ridge High School ',
        'website. It can be wrong, out of date, or miss things the site does ',
        'not cover. Check anything that matters &mdash; a deadline, a fee, a ',
        'room &mdash; against the source it cites, or with the front office.',
        '</p>',
        '<div class="disclaimer-actions">',
        '<button type="button" class="cancel">Cancel</button>',
        '<button type="button" class="accept">I understand',
        '<span class="arrow" aria-hidden="true">&rarr;</span></button>',
        '</div>',
        '</div>'
      ].join("");
      document.body.appendChild(wrap);
      // One frame at the starting state before the class that moves it, or
      // the browser coalesces both into the final state and there is no
      // transition to see.
      requestAnimationFrame(() => wrap.classList.add("open"));

      const close = () => {
        wrap.classList.remove("open");
        // Removed after the fade, not during it. Taking the node out on the
        // click is what made this disappear rather than close.
        const done = (e) => {
          if (e && e.target !== wrap) return;
          wrap.removeEventListener("transitionend", done);
          wrap.remove();
        };
        wrap.addEventListener("transitionend", done);
        // A transition that never runs fires no event - a reader on reduced
        // motion, or a tab that was backgrounded mid-close.
        setTimeout(() => { if (wrap.isConnected) wrap.remove(); }, 420);
      };
      wrap.querySelector(".cancel").addEventListener("click", close);
      wrap.querySelector(".accept").addEventListener("click", () => {
        accepted = true;
        close();
        proceed();
      });
      wrap.addEventListener("click", (e) => { if (e.target === wrap) close(); });
      wrap.querySelector(".accept").focus();

      return false;
    };
  })();
  </script>

<script>
  // Enter sends. The composer is a single-line input, so there is no newline
  // to preserve, and reaching for the mouse to send every message was the
  // largest friction in the interface.
  document.addEventListener("DOMContentLoaded", () => {
    const box = document.getElementById("query");

    // Start typing anywhere and the composer takes it.
    //
    // The composer is the only thing anyone types into, so requiring a click
    // first is a step that exists for no reason - and it is easy to lose:
    // clicking a source pill or a thumb moves focus away, and the next
    // keystroke went nowhere.
    //
    // The event is not cancelled, so the character that triggered this lands
    // in the box on its own. Modifier combinations are left alone, or this
    // would swallow copy, paste, find and reload.
    document.addEventListener("keydown", (e) => {
      if (!box || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length !== 1) return;

      const active = document.activeElement;
      const tag = active && active.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (active && active.isContentEditable) return;

      // Someone selecting an answer to copy is not trying to type.
      const selection = window.getSelection();
      if (selection && String(selection).length) return;

      // Nor someone reading a sheet, whose composer is behind it.
      if (document.querySelector(".sheet")) return;

      box.focus();
    });

    if (box) {
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing) {
          e.preventDefault();
          sendMessage();
        }
      });
    }

    // The suggestion strip scrolls sideways, but a plain mouse has no
    // horizontal wheel and the scrollbar is hidden. Translate a vertical
    // wheel into horizontal movement, and allow click and drag.
    const strip = document.querySelector(".quick-prompts");
    if (!strip) return;

    // Fade an end only when there is something past it.
    const updateFades = () => {
      const max = strip.scrollWidth - strip.clientWidth;
      strip.classList.toggle("fade-start", strip.scrollLeft > 4);
      strip.classList.toggle("fade-end", strip.scrollLeft < max - 4);
    };
    strip.addEventListener("scroll", updateFades, { passive: true });
    window.addEventListener("resize", updateFades);
    updateFades();

    strip.addEventListener("wheel", (e) => {
      const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (!delta) return;
      const before = strip.scrollLeft;
      strip.scrollLeft += delta;
      // Only swallow the event if the strip actually moved, so the page can
      // still scroll when the strip is already at its end.
      if (strip.scrollLeft !== before) e.preventDefault();
    }, { passive: false });

    let dragging = false, startX = 0, startScroll = 0, moved = 0;

    strip.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      dragging = true;
      moved = 0;
      startX = e.clientX;
      startScroll = strip.scrollLeft;
      strip.classList.add("dragging");
    });

    strip.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      moved = Math.max(moved, Math.abs(dx));
      strip.scrollLeft = startScroll - dx;
    });

    const endDrag = () => {
      dragging = false;
      strip.classList.remove("dragging");
    };
    strip.addEventListener("pointerup", endDrag);
    strip.addEventListener("pointerleave", endDrag);

    // A drag that moved should not also fire the button underneath it.
    strip.addEventListener("click", (e) => {
      if (moved > 6) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
  });


  // Kept so a thumbs rating can be filed against the question that produced it
  // and the checks that ran on it, rather than as a bare vote.
  let lastAnswerMeta = { question: "", notice: [] };

  // The conversation, so a follow-up can be understood as one.
  //
  // Asked "does Dr. Morgan go to this school" and then "who is he", the bot
  // used to answer the second question cold - it never saw the first. Every
  // request carried only the current line, so a pronoun had nothing to refer
  // back to and retrieval matched three function words against the corpus.
  //
  // Held here rather than on the server because the server has no sessions,
  // which is what lets it run on one free instance with several threads and no
  // store. Trimmed to the last few turns so a long conversation does not grow
  // the request without limit.
  let conversation = [];
  const HISTORY_TURNS = 6;
  function appendMessage(text, sender) {
    const msgContainer = document.getElementById("messages");

    // Create chat bubble
    const bubble = document.createElement("div");
    bubble.className = `chat-bubble ${sender}`;

    // Strip trailing newlines + parse markdown inline
    const trimmed = text.replace(/\n+$/, "");
    if (sender === "user") {
      // The text in its own element, so it can come into focus while the
      // bubble around it is still travelling. See .chat-bubble.user.launch.
      const inner = document.createElement("span");
      inner.className = "ub-text";
      inner.innerHTML = renderInline(trimmed);
      bubble.appendChild(inner);
      bubble.classList.add("launch");
      // Taken off once it has played. Showing a hidden list again restarts
      // any animation still named on its children, and the question would
      // be sent a second time on screen.
      bubble.addEventListener("animationend", (e) => {
        if (e.target === bubble) bubble.classList.remove("launch");
      });
    } else {
      bubble.innerHTML = renderInline(trimmed);
    }

    msgContainer.appendChild(bubble);

    // No feedback control here. This path renders messages that were not
    // streamed, and it used to append a second "Was this message helpful?"
    // widget that only rewrote its own text - it posted nothing, so every
    // rating collected through it was discarded. The real one is built in the
    // streaming path, where the retrieval diagnostics the rating has to be
    // filed against actually exist.

    // Auto-scroll
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }



  
  const overlay = document.getElementById("disclaimerOverlay");
  const dismissBtn = document.getElementById("disclaimerBtn");

  // Shown for the classic skin, once. Two conditions, and both matter:
  //
  //   * Not in compact. That skin gates the first question behind its own
  //     "Before you ask" card, and stacking a second notice in front of an
  //     empty screen is how a reader learns to dismiss notices unread. The
  //     widget route opens in compact, so this never fires there on load -
  //     only if somebody presses 2 and lands in the classic interface.
  //   * Not already accepted. The accept is remembered, which is the whole
  //     point of asking; re-asking every visit is a cookie banner.
  //
  // Called rather than run inline, because the other place it has to happen
  // is the moment the reader switches out of compact for the first time.
  let disclaimerShown = false;
  window.showStandingDisclaimer = function () {
    if (disclaimerShown) return;
    if (document.body.classList.contains("compact")) return;
    if (localStorage.getItem("vrhsDisclaimerAccepted") === "true") return;
    disclaimerShown = true;
    overlay.classList.add("shown");
  };

  dismissBtn.addEventListener("click", () => {
    // Taking .shown off runs the fade and the card's slide together, and the
    // delayed visibility in the CSS is what removes it from reach once they
    // have finished. No display juggling, so nothing cancels mid-animation.
    overlay.classList.remove("shown");
    localStorage.setItem("vrhsDisclaimerAccepted", "true");
  });


    function quickAsk(text) {
      document.getElementById("query").value = text;
      if (window.updateSendState) window.updateSendState();
      sendMessage();
    }

    function showOptionsModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('optionsModal').classList.toggle('open');
    }

    // Clicking anywhere else closes the menu, which is what a popover should
    // do and what the full-screen overlay used to handle.
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('optionsModal');
      if (!menu || !menu.classList.contains('open')) return;
      if (!menu.contains(e.target)) menu.classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const menu = document.getElementById('optionsModal');
        if (menu) menu.classList.remove('open');
      }
    });

    function showReportModal() {
      document.getElementById('optionsModal').classList.remove('open');
      document.getElementById('reportModal').style.display = 'block';
    }

    function hideReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    async function submitReport() {
      const description = document.getElementById('reportDescription').value;
      if (description.trim()) {
        try {
          const response = await fetch("/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ description: description.trim() })
          });
          
          if (response.ok) {
            document.getElementById('reportDescription').value = '';
            document.getElementById('optionsModal').style.display = 'none';
            document.getElementById('reportModal').style.display = 'none';
            showNotification('Thank you for your report. We will review it shortly.');
          } else {
            throw new Error('Failed to submit report');
          }
        } catch (error) {
          showNotification('Failed to submit report. Please try again.', 'error');
        }
      } else {
        showNotification('Please provide a description of the inaccuracy.', 'error');
      }
    }

    // Close modals when clicking outside
    window.onclick = function(event) {
      if (event.target.className === 'modal') {
        event.target.style.display = 'none';
      }
    }

    function showNotification(message, type = 'success') {
      const notificationDiv = document.getElementById('notification');
      notificationDiv.textContent = message;
      if (message === "Please provide a description of the inaccuracy.") {
        type = 'error';
      }
      notificationDiv.className = `notification ${type}`;
      requestAnimationFrame(() => {
        notificationDiv.classList.add('show');
      });
      setTimeout(() => {
        notificationDiv.classList.remove('show');
      }, 3000);
    }

    window.onload = function () {
      // Both of these are skipped in compact mode. The greeting is a turn in
      // the conversation that says nothing, and compact opens on an empty
      // screen where a lone "Hi!" is the only thing in it. The standing
      // disclaimer is redundant there too, because that skin gates the first
      // question behind one that has to be accepted.
      if (document.body.classList.contains("compact")) return;

      if (window.showStandingDisclaimer) window.showStandingDisclaimer();

      appendMessage("Hi! What can I help you with?", "bot");
      // Insert disclaimer right under the first bot message
      const chatMessages = document.querySelector(".chat-messages");
      const disclaimer = document.createElement("div");
      disclaimer.className = "mid-disclaimer";
      disclaimer.innerText = "Responses may be inaccurate. Check official VRHS or LISD sources for verified information.";
      chatMessages.appendChild(disclaimer);
      /* 
      appendMessage("Who are you?", "user");
      appendMessage("I am a chatbot designed to answer your questions about VRHS.", "bot"); */ 
      //appendMessage("What can you do?", "user");
      //appendMessage("I can answer questions about VRHS, such as where to find the calendar, how many hours you owe, and how to volunteer.", "bot");

    };

    const queryInput = document.getElementById("query");
    const submitButton = document.getElementById("submitButton");

    // Clearing the box in code fires no "input" event, so the button used to
    // stay red after sending. Both paths now call the same updater.
    window.updateSendState = () => {
      const hasText = queryInput.value.trim() !== "";
      submitButton.style.backgroundColor = hasText ? "#e60023" : "#c9cdd2";
      submitButton.style.cursor = hasText ? "pointer" : "default";
    };

    queryInput.addEventListener("input", window.updateSendState);
    window.updateSendState();
  </script>
</body>
